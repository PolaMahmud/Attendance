<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12283F">
<title>Attendance</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2312283F'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='Arial'>A</text></svg>">

<!-- Start the DNS lookup and TLS handshake for Apps Script now, in parallel with
     parsing this page, rather than when the iframe is created a moment later. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Same faces the app uses, so the cached cards do not reflow when the live
     app fades in over them. Non-blocking: it never delays first paint. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">

<style>
  :root{
    --ink:#0B1020; --ink-2:#55607A; --ink-3:#8F98AD;
    --glass:rgba(255,255,255,.50); --glass-line:rgba(255,255,255,.65);
    --blur:saturate(180%) blur(20px);
    --shadow:0 1px 1px rgba(16,24,48,.04), 0 10px 30px -18px rgba(16,24,48,.45);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --display:"Bricolage Grotesque","Inter",-apple-system,sans-serif;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#EFF2F8;
    font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  /* the same colour field the app sits on, so the shell and the app are continuous */
  body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(56px);
    background:
      radial-gradient(30% 34% at 12% 14%, rgba(86,120,255,.70), transparent 66%),
      radial-gradient(28% 30% at 90% 10%, rgba(255,120,190,.58), transparent 66%),
      radial-gradient(34% 36% at 80% 86%, rgba(48,214,200,.55), transparent 66%),
      radial-gradient(30% 34% at 14% 90%, rgba(255,190,90,.50), transparent 66%),
      linear-gradient(180deg,#F4F6FB 0%,#E9EDF6 100%)}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2;opacity:0;
    transition:opacity .25s ease}
  iframe.ready{opacity:1}

  /* ---- placeholder layer: either the skeleton or the cached cards ---- */
  .ph{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);
    transition:opacity .25s ease}
  .ph.gone{opacity:0;pointer-events:none}
  .inner{max-width:900px;margin:0 auto}

  .sbar{display:flex;align-items:center;gap:10px;padding:12px 4px 16px}
  .slogo{font-weight:700;font-size:17px;letter-spacing:-.02em;color:#0B1020}
  .spill{width:74px;height:26px;border-radius:99px;background:rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.95)}
  .sdot{margin-left:auto;width:26px;height:26px;border-radius:50%;background:rgba(11,16,32,.82)}
  .sblock{border-radius:18px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.9);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 10px 30px -18px rgba(16,24,48,.45);
    -webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px);
    margin-bottom:12px;overflow:hidden;position:relative}
  .sblock::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);
    background-size:220% 100%;animation:sh 1.4s linear infinite}
  @keyframes sh{from{background-position:180% 0}to{background-position:-80% 0}}
  .h76{height:76px}.h44{height:44px}
  @media (prefers-reduced-motion:reduce){.sblock::after{animation:none}}

  /* ---- cached view: mirrors the app's own cards so the swap is invisible ---- */
  .name{margin-left:auto;display:flex;align-items:center;gap:8px}
  .name .nm{font-size:13.5px;font-weight:500;color:var(--ink-2)}
  .avatar{width:26px;height:26px;border-radius:50%;background:rgba(11,16,32,.82);color:#fff;
    display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;flex:none}
  .dhead{text-align:center;margin:2px 0 14px}
  .dhead b{display:block;font-family:var(--display);font-size:20px;letter-spacing:-.02em}
  .dhead span{font-size:12.5px;color:var(--ink-2)}
  .note{display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12px;color:var(--ink-2);margin:0 auto 14px;padding:6px 12px;width:max-content;
    max-width:100%;background:rgba(255,255,255,.42);border:1px solid var(--glass-line);
    border-radius:99px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .spin{width:11px;height:11px;border-radius:50%;border:2px solid rgba(11,16,32,.18);
    border-top-color:rgba(11,16,32,.55);animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  .lessons{display:grid;gap:12px}
  @media(min-width:620px){.lessons{grid-template-columns:1fr 1fr}}
  .lsn{display:flex;gap:14px;align-items:center;text-align:left;width:100%;
    background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:14px;
    box-shadow:var(--shadow);pointer-events:none;
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .lsn .per{width:44px;flex:none;text-align:center}
  .lsn .per b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-.03em;line-height:1}
  .lsn .per span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .lsn .mid{flex:1;min-width:0}
  .lsn .mid .t{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
  .lsn .mid .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .lsn .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
  .lsn .end .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .lsn.leave{opacity:.72}
  .chip{font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;white-space:nowrap;
    border:1px solid transparent}
  .chip.ok{background:rgba(6,122,85,.12);border-color:rgba(6,122,85,.22);color:#046b4b}
  .chip.todo{background:rgba(43,68,255,.12);border-color:rgba(43,68,255,.24);color:#1b31d8}
  .chip.bad{background:rgba(180,35,24,.12);border-color:rgba(180,35,24,.24);color:#a01e14}
  .chip.leave{background:rgba(184,80,10,.13);border-color:rgba(184,80,10,.24);color:#9b4408}
  .chip.wait{background:rgba(11,16,32,.06);border-color:rgba(11,16,32,.10);color:var(--ink-3)}
  .chip.queued{background:rgba(43,68,255,.14);border-color:rgba(43,68,255,.26);color:#1b31d8}

  /* ---- taking a register before the app is up ---- */
  .lsn.tap{pointer-events:auto;cursor:pointer;text-align:left}
  .lsn.tap:active{transform:scale(.995)}
  .qbar{display:flex;align-items:center;gap:12px;padding:2px 4px 14px}
  .qbar b{font-family:var(--display);font-size:19px;letter-spacing:-.02em;flex:1;min-width:0}
  .qback{background:rgba(255,255,255,.6);border:1px solid var(--glass-line);border-radius:10px;
    width:36px;height:36px;flex:none;cursor:pointer;font-size:17px;line-height:1;color:var(--ink)}
  .qsub{font-size:12.5px;color:var(--ink-2);padding:0 4px 12px}
  .srow{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--glass);
    border:1px solid var(--glass-line);border-radius:14px;margin-bottom:8px;
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .snm{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:4px;flex:none}
  .sg{width:34px;height:34px;border-radius:9px;border:1px solid rgba(11,16,32,.12);
    background:rgba(255,255,255,.7);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-3)}
  .sg.on.p{background:#067A55;border-color:#067A55;color:#fff}
  .sg.on.l{background:#B8500A;border-color:#B8500A;color:#fff}
  .sg.on.a{background:#B42318;border-color:#B42318;color:#fff}
  .qacts{display:flex;gap:10px;margin:14px 0 4px;position:sticky;bottom:0;
    padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}
  .qbtn{flex:1;padding:15px;border:0;border-radius:13px;background:#12283F;color:#fff;
    font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .qbtn.alt{background:rgba(255,255,255,.72);color:var(--ink);border:1px solid var(--glass-line)}
  .qnote{font-size:12px;color:var(--ink-2);text-align:center;padding:8px 0 0}

  /* ---- first-ever open: ask for the code ---- */
  .ask{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:24px}
  .box{width:100%;max-width:320px;text-align:center}
  .box h1{font-size:19px;margin:0 0 6px;color:#0E1B2A}
  .box p{font-size:13.5px;color:#67788C;margin:0 0 18px;line-height:1.5}
  .box input{width:100%;padding:13px;border:1px solid #E3E7ED;border-radius:12px;font-size:16px;
    text-align:center;letter-spacing:.05em;background:#fff;color:#0E1B2A}
  .box button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:#12283F;
    color:#fff;font-size:15.5px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<!--
  SETUP: paste your web app /exec URL into WEBAPP_URL below. Nothing else to change.

  Send each teacher:  https://YOURNAME.github.io/attendance/?t=THEIR_TOKEN
  On first open the code is saved on their device and wiped from the address bar, so
  the link stops being visible in history, screenshots or over-the-shoulder glances.
  This file itself contains no teacher codes — it is safe to host publicly.

  After the first successful load the app posts a copy of the day back to this page,
  which stores it per token. Later opens paint those cards immediately, so the teacher
  is looking at their real timetable while Apps Script is still starting up. The
  snapshot holds no student names and no marks — only the lesson grid.
-->
<div class="ask" id="ask" style="display:none">
  <div class="box">
    <h1>Attendance</h1>
    <p>Enter the code from your attendance link.</p>
    <input id="code" type="text" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="your code">
    <button id="go">Open my register</button>
  </div>
</div>

<div class="ph" id="shell" aria-hidden="true">
  <div class="inner">
    <div class="sbar"><span class="slogo">Attendance</span><span class="spill"></span><span class="sdot"></span></div>
    <div class="sblock h44" style="width:70%;margin:0 auto 16px"></div>
    <div class="sblock h76"></div>
    <div class="sblock h76"></div>
    <div class="sblock h76"></div>
  </div>
</div>

<div class="ph" id="instant" aria-hidden="true" style="display:none"><div class="inner" id="instantInner"></div></div>
<div class="ph" id="quick" style="display:none"><div class="inner" id="quickInner"></div></div>
<div id="slot"></div>

<script>
(function () {
  'use strict';

  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxtkE0-FzD5YCp5yweSo4pP2EEtZdVfEl7mW_VTa7hnEkCx41gqpfLj6IonJtCksQHh/exec';
  var KEY   = 'attendance-code';
  var SNAP  = 'attendance-snap:';     // one entry per token, so a shared device cannot mix people up
  var QUEUE = 'attendance-queue:';    // registers marked before the app was up
  var KEEP_DAYS = 10;

  /* How stale a class list may be and still be typed into. The timetable repeats
     weekly, so last Tuesday's list is almost always this Tuesday's — but a student
     who joined or left three weeks ago should not still be on it. The server has the
     last word regardless: apiSave rebuilds the marks from the current roster. */
  var ROSTER_DAYS = 14;

  function $(id){ return document.getElementById(id); }
  function p2(n){ return (n < 10 ? '0' : '') + n; }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function stored(){ try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function keep(t){ try { localStorage.setItem(KEY, t); } catch (e) {} }

  /* ---- the device-side snapshot ------------------------------------------ */

  function readSnap(token){
    try {
      var raw = localStorage.getItem(SNAP + token);
      if (!raw) return null;
      var s = JSON.parse(raw);
      return (s && s.v === 1) ? s : null;
    } catch (e) { return null; }
  }
  function writeSnap(token, s){
    try { localStorage.setItem(SNAP + token, JSON.stringify(s)); } catch (e) {}
  }

  /* Store today's day under its date, and also keep the lesson grid under its
     weekday. The timetable repeats weekly, so last Monday's grid is a correct
     preview of this Monday's — the marks are not, which is why only the
     structure is reused and every chip is reset. */
  function absorbSnap(token, msg){
    var s = readSnap(token) || { v:1, days:{}, dow:{} };
    s.meta = { school: msg.school, teacher: msg.teacher };
    s.days = s.days || {}; s.dow = s.dow || {}; s.dowAt = s.dowAt || {};
    if (msg.day && msg.day.date) {
      msg.day.savedAt = Date.now();
      s.days[msg.day.date] = msg.day;
      /* Key the weekday grid by the same three-letter weekday paintCached reads.
         dayShort is a DISPLAY string from the server — "Friday 28 Aug" — so keying
         on it wrote the grid under one name and read it under another, and the two
         never met. That silently disabled the fallback that matters most: the first
         open of each morning, when there is no snapshot for today yet. Deriving the
         key from the day's own date cannot drift from the label's format. */
      var dow = SHORT[asDate(msg.day.date).getDay()];
      if (dow) {
        s.dow[dow] = msg.day.lessons || [];
        s.dowAt[dow] = Date.now();                    // how old this class list is
      }
      // Drop anything written under the old display-string key.
      Object.keys(s.dow).forEach(function (k) {
        if (SHORT.indexOf(k) === -1) { delete s.dow[k]; delete s.dowAt[k]; }
      });
      var keys = Object.keys(s.days).sort();
      while (keys.length > KEEP_DAYS) delete s.days[keys.shift()];
    }
    writeSnap(token, s);
  }

  /* ---- registers marked before the app finished loading ------------------- */

  function readQueue(token){
    try { return JSON.parse(localStorage.getItem(QUEUE + token) || '[]') || []; }
    catch (e) { return []; }
  }
  function writeQueue(token, q){
    try { localStorage.setItem(QUEUE + token, JSON.stringify(q)); } catch (e) {}
  }
  function sameLesson(a, b){
    return a.classId === b.classId && a.date === b.date && String(a.period) === String(b.period);
  }
  /* One entry per lesson: marking it twice before it syncs replaces, never duplicates. */
  function queueAdd(token, item){
    var q = readQueue(token).filter(function (x) { return !sameLesson(x, item); });
    q.push(item);
    writeQueue(token, q);
  }
  function queueDrop(token, m){
    writeQueue(token, readQueue(token).filter(function (x) { return !sameLesson(x, m); }));
  }
  function queuedFor(token, l, iso){
    var q = readQueue(token);
    for (var i = 0; i < q.length; i++) {
      if (sameLesson(q[i], { classId: l.classId, date: iso, period: l.period })) return q[i];
    }
    return null;
  }

  /* ---- rendering the cached view ----------------------------------------- */

  var DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var SHORT  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function todayIso(){ var d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
  // midday avoids any daylight-saving edge shifting the day by one
  function asDate(iso){ return new Date(iso + 'T12:00:00'); }
  function initials(n){
    return String(n||'').trim().split(/\s+/).slice(0,2)
      .map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
  }

  function chip(l, live, queued){
    if (queued)  return '<span class="chip queued">Saved &middot; syncing</span>';
    if (!live)   return '<span class="chip wait">&hellip;</span>';
    if (l.taken) return '<span class="chip ok">Taken</span>';
    if (l.leave) return '<span class="chip leave">' + esc(l.leave) + '</span>';
    return '<span class="chip todo">To do</span>';
  }
  /* Tappable only when we hold a class list for it that is recent enough to type
     into, and the lesson is not someone else's cover. */
  function markable(l, fresh){
    return !!(fresh && l.students && l.students.length && !l.leave);
  }
  function card(l, admin, live, i, fresh, queued){
    var sub = [ (l.start ? l.start + '\u2013' + l.end : ''), l.room, (admin ? l.teacher : '') ]
      .filter(Boolean).join(' \u00b7 ');
    var count = queued ? 'register ready'
              : (live && l.taken) ? (l.flagged + '/' + l.total + ' flagged')
                                  : (l.total + ' students');
    var tap = markable(l, fresh);
    return '<' + (tap ? 'button type="button"' : 'div') +
      ' class="lsn' + (l.leave && !l.taken ? ' leave' : '') + (tap ? ' tap' : '') + '"' +
      (tap ? ' data-i="' + i + '"' : '') + '>' +
      '<div class="per"><b>' + esc(l.period) + '</b><span>Per</span></div>' +
      '<div class="mid"><div class="t">' + esc(l.label) + '</div>' +
      '<div class="s">' + esc(sub) + '</div></div>' +
      '<div class="end">' + chip(l, live, queued) + '<span class="n">' + esc(count) + '</span></div>' +
      '</' + (tap ? 'button' : 'div') + '>';
  }

  /**
   * Paint whatever the device already knows. Returns true if anything was drawn.
   * Three levels, in order of preference:
   *   1. today's own snapshot     -> real cards, real chips
   *   2. the same weekday's grid  -> real cards, chips reset to "…"
   *   3. name and date only       -> skeleton cards underneath
   * It never guesses attendance: a chip only appears when it came from today.
   */
  function paintCached(token){
    var s = readSnap(token);
    if (!s || !s.meta) return false;

    var iso = todayIso(), d = asDate(iso);
    var day = s.days && s.days[iso];
    var live = !!day;
    var at = day ? day.savedAt : 0;
    if (!day) {
      var key = SHORT[d.getDay()];
      var proto = s.dow && s.dow[key];
      if (proto && proto.length) { day = { lessons: proto }; at = (s.dowAt && s.dowAt[key]) || 0; }
    }
    // Old enough that someone may have joined or left the class since.
    var fresh = !!at && (Date.now() - at) < ROSTER_DAYS * 864e5;

    var admin = !!(s.meta.teacher && s.meta.teacher.admin);
    var name  = (s.meta.teacher && s.meta.teacher.name) || '';
    var lessons = (day && day.lessons) || [];
    var anyTap = lessons.some(function (l) { return markable(l, fresh); });

    QS.token = token;
    QS.lessons = lessons;
    QS.admin = admin;
    QS.live = live;
    QS.fresh = fresh;
    QS.iso = iso;

    var html =
      '<div class="sbar"><span class="slogo">' + esc(s.meta.school || 'Attendance') + '</span>' +
      '<span class="name"><span class="nm">' + esc(name) + '</span>' +
      '<span class="avatar">' + esc(initials(name)) + '</span></span></div>' +
      '<div class="dhead"><b>' + esc(DAYS[d.getDay()]) + '</b><span>' +
        esc(d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear()) + '</span></div>' +
      '<div class="note"><span class="spin"></span>' +
        (anyTap ? 'Ready \u2014 tap a lesson to take the register'
                : live ? 'Your last view \u00b7 updating' : 'Your usual timetable \u00b7 checking today') +
      '</div>';

    if (lessons.length) {
      html += '<div class="lessons">' +
        lessons.map(function (l, i) {
          return card(l, admin, live, i, fresh, !!queuedFor(token, l, iso));
        }).join('') +
        '</div>';
    } else {
      html += '<div class="sblock h76"></div><div class="sblock h76"></div><div class="sblock h76"></div>';
    }

    $('instantInner').innerHTML = html;
    $('instant').style.display = 'block';
    $('shell').classList.add('gone');
    return true;
  }

  /* ---- the register the teacher can take while Apps Script is still starting ---- */

  var QS = { token:'', lessons:[], admin:false, live:false, fresh:false, iso:'',
             lesson:null, marks:{}, editing:false, ready:false, frame:null, onDone:null };

  function repaintCards(){
    if (!QS.lessons.length) return;
    var host = $('instantInner').querySelector('.lessons');
    if (!host) return;
    host.innerHTML = QS.lessons.map(function (l, i) {
      return card(l, QS.admin, QS.live, i, QS.fresh, !!queuedFor(QS.token, l, QS.iso));
    }).join('');
  }

  function openQuick(i){
    var l = QS.lessons[i];
    if (!l || !markable(l, QS.fresh)) return;
    QS.lesson = l;
    QS.marks = {};
    var prev = queuedFor(QS.token, l, QS.iso);
    l.students.forEach(function (st) {
      QS.marks[st.id] = (prev && prev.statuses && prev.statuses[st.id]) || 'P';
    });
    QS.editing = true;
    $('quick').style.display = 'block';
    $('instant').style.display = 'none';
    renderQuick();
  }
  function closeQuick(){
    QS.editing = false;
    QS.lesson = null;
    $('quick').style.display = 'none';
    $('instant').style.display = 'block';
    repaintCards();
    // The app may have finished loading while they were marking; only now is it
    // safe to swap the screen out from under them.
    if (QS.ready && QS.onDone) QS.onDone();
  }

  function renderQuick(){
    var l = QS.lesson;
    var sub = [ (l.start ? l.start + '\u2013' + l.end : ''), l.room ].filter(Boolean).join(' \u00b7 ');
    var rows = l.students.map(function (st) {
      var on = QS.marks[st.id] || 'P';
      return '<div class="srow"><span class="snm">' + esc(st.name) + '</span>' +
        '<span class="seg" data-id="' + esc(st.id) + '">' +
        ['P', 'L', 'A'].map(function (k) {
          return '<button type="button" class="sg' + (on === k ? ' on ' + k.toLowerCase() : '') +
                 '" data-k="' + k + '">' + k + '</button>';
        }).join('') + '</span></div>';
    }).join('');

    $('quickInner').innerHTML =
      '<div class="qbar"><button type="button" class="qback" id="qb" aria-label="Back to lessons">&#8249;</button>' +
      '<b>' + esc(l.label) + '</b></div>' +
      '<div class="qsub">Period ' + esc(l.period) + (sub ? ' \u00b7 ' + esc(sub) : '') +
        ' \u00b7 ' + l.students.length + ' students</div>' +
      rows +
      '<div class="qacts">' +
        '<button type="button" class="qbtn alt" id="qall">All present</button>' +
        '<button type="button" class="qbtn" id="qsave">Save register</button>' +
      '</div>' +
      '<div class="qnote">Saves as soon as the app finishes loading.</div>';

    $('qb').addEventListener('click', closeQuick);
    $('qall').addEventListener('click', function () {
      l.students.forEach(function (st) { QS.marks[st.id] = 'P'; });
      renderQuick();
    });
    $('qsave').addEventListener('click', saveQuick);
    $('quickInner').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.sg') : null;
      if (!b) return;
      var seg = b.parentNode, id = seg.getAttribute('data-id');
      QS.marks[id] = b.getAttribute('data-k');
      Array.prototype.forEach.call(seg.querySelectorAll('.sg'), function (x) {
        x.className = 'sg' + (x === b ? ' on ' + b.getAttribute('data-k').toLowerCase() : '');
      });
    });
    $('quick').scrollTop = 0;
  }

  function saveQuick(){
    var l = QS.lesson, statuses = {};
    l.students.forEach(function (st) { statuses[st.id] = QS.marks[st.id] || 'P'; });
    queueAdd(QS.token, { classId: l.classId, date: QS.iso, period: l.period,
                         statuses: statuses, label: l.label, at: Date.now() });
    closeQuick();
    flushQueue();
  }

  /* google.script.run only exists inside the app's frame, so queued registers are
     handed to it to write. Entries stay put until the app confirms each one.

     The target is the window that talked to US (captured from the inbound message),
     never our own iframe's contentWindow — that iframe is Google's shim page, and
     the app runs in a sandbox frame one level below it. Posting to the shim drops
     the message silently. */
  function flushQueue(){
    var target = QS.app || (QS.frame && QS.frame.contentWindow);
    if (!QS.ready || !target) return;
    var q = readQueue(QS.token);
    if (!q.length) return;
    try { target.postMessage({ type:'attendance:save', v:1, items:q }, '*'); } catch (e) {}
  }

  /* ---- opening the app ---------------------------------------------------- */

  /* Anything else in the address (view=students, s=P014) rides along to the app. */
  function passthrough(){
    var extra = '';
    location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return;
      var k = kv.split('=')[0];
      if (k === 't') return;                       // the code is handled separately
      extra += '&' + kv;
    });
    return extra;
  }

  /* ---- timing readout, shown only with ?debug=1 --------------------------
     Measures the real thing on the real device, rather than a stand-in on a
     laptop. Also prints which deployment is being called, which is the usual
     culprit when the app is slower in use than in a test. */
  var DEBUG = /[?&]debug=1/.test(location.search);
  var T0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var marks = [];
  function mark(label){
    if (!DEBUG) return;
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    marks.push([label, Math.round(now - T0)]);
    var el = $('dbg');
    if (!el) {
      el = document.createElement('div');
      el.id = 'dbg';
      el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9;' +
        'background:rgba(11,16,32,.90);color:#fff;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;' +
        'padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-height:44vh;overflow:auto';
      document.body.appendChild(el);
    }
    var dep = (WEBAPP_URL.match(/\/macros\/s\/([^/]+)/) || ['',''])[1];
    el.textContent = 'deployment ' + dep.substring(0, 16) + '…\n' +
      marks.map(function (m) { return m[1] + ' ms  ' + m[0]; }).join('\n');
  }

  function open(t, extra){
    $('ask').style.display = 'none';
    mark('script start');

    // Only preview the register when the link is asking for the register. A link
    // carrying view=students or s=P014 wants a different screen entirely.
    if (!extra) {
      try { mark(paintCached(t) ? 'cached cards painted' : 'no cache — skeleton'); } catch (e) {}
    }

    var shown = false;
    var f = null;
    function reveal(){
      if (shown) return;
      // Never swap the app in over a half-marked register. closeQuick calls back.
      if (QS.editing) { QS.onDone = reveal; return; }
      shown = true;
      if (f) f.classList.add('ready');
      setTimeout(function () {
        $('shell').classList.add('gone');
        $('instant').classList.add('gone');
      }, 180);
    }

    // Tapping a cached lesson opens the register, before the app is anywhere near up.
    $('instant').addEventListener('click', function (e) {
      var c = e.target.closest ? e.target.closest('.lsn.tap') : null;
      if (!c) return;
      openQuick(Number(c.getAttribute('data-i')));
    });

    // Store every snapshot the app sends, for this open and all the ones after.
    window.addEventListener('message', function (e) {
      var m = e && e.data;
      // Remember which window the app actually speaks from; it is not our iframe.
      if (e.source && e.source !== window &&
          (m === 'attendance:ready' || (m && m.v === 1))) QS.app = e.source;
      if (m === 'attendance:ready') {
        mark('app painted (attendance:ready)');
        QS.ready = true;
        flushQueue();                       // anything marked while it was loading
        reveal();
        return;
      }
      if (!m || m.v !== 1) return;
      if (m.type === 'attendance:snapshot') {
        try { absorbSnap(t, m); } catch (err) {}
        return;
      }
      if (m.type === 'attendance:saved') {
        // Only drop it once the server has confirmed; a failure keeps it queued so
        // the next open tries again rather than losing the register.
        if (m.ok) { queueDrop(t, m); mark('queued register saved'); }
        else { mark('queued register failed: ' + (m.error || '')); }
        if (!QS.editing) repaintCards();
      }
    });

    // Built fresh with its src already set, so the only load event is the app's own —
    // an iframe that starts empty fires one for about:blank and hides the shell too early.
    f = document.createElement('iframe');
    f.id = 'app';
    f.title = 'Attendance';
    f.setAttribute('allow', 'clipboard-write');

    // Hard stop, in case an older build is deployed that doesn't post the message.
    // This used to be the normal path rather than the exception: the app was posting
    // to the wrong window, so nothing ever arrived and every open sat here for the
    // full 12 seconds while the app itself had been ready for nine of them.
    setTimeout(reveal, 12000);
    f.onload = function () {
      mark('iframe document loaded');
      // Second line of defence. Only fires if attendance:ready never lands; when it
      // does, reveal has already run and this is a no-op.
      setTimeout(reveal, 3500);
    };
    f.src = WEBAPP_URL + '?t=' + encodeURIComponent(t) + (extra || '');
    QS.frame = f;
    $('slot').appendChild(f);
    mark('iframe requested');

    // never leave a placeholder up forever if something goes wrong
    setTimeout(function () {
      if (QS.editing) return;                 // unless they are mid-register
      f.classList.add('ready');
      $('shell').classList.add('gone');
      $('instant').classList.add('gone');
    }, 15000);
  }

  var extra = passthrough();
  var fromLink = (location.search.match(/[?&]t=([^&]+)/) || [])[1] || '';
  if (fromLink) {
    fromLink = decodeURIComponent(fromLink);
    keep(fromLink);
    // drop the code from the address bar, but keep any view the link asked for
    history.replaceState(null, '', location.pathname + (extra ? '?' + extra.substring(1) : ''));
    open(fromLink, extra);
  } else if (stored()) {
    open(stored(), extra);
  } else {
    $('shell').classList.add('gone');
    $('ask').style.display = 'grid';
    $('go').addEventListener('click', function () {
      var v = $('code').value.trim();
      if (!v) return;
      keep(v); open(v, extra);
    });
    $('code').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('go').click();
    });
  }
})();
</script>
</body>
</html>
