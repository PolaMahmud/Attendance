      : '<div class="ttmsg"><span class="spin"></span><span>' + esc(hint || '') + '</span></div>') + '</div>';
  }
  function ttCard(tt, strip, iso, d, hint, away, fold){
    if (!tt || !(tt.days || []).length) return stripGap(strip);
    // The app carries the countdown on the lesson's own row (H15): no card to hold open.
    if (away && fold) return '';
    if (away) return nowCard(hint);
    var when = '<div class="ttwhenwrap"><div class="ttc ttwhen">' + TT_CAL +
      '<span><span class="d">' + esc(SHORT[d.getDay()] + ' ' + d.getDate() + ' ' +
        MONTHS[d.getMonth()]) + '</span><b class="t"></b></span></div></div>';
    var body = tt.open === false ? '' :
      '<div class="ttbody">' + (tt.view === 'day' ? ttDayView(tt, iso) : ttWeek(tt, iso)) + '</div>';
    return when +
      '<section class="ttc tt">' +
        '<div class="tthead">' +
          '<span class="ttlab">' + TT_CAL + '<span class="w">Timetable</span></span>' +
          '<div class="ttviews">' +
            '<span class="ttview' + (tt.view === 'day' ? '' : ' on') + '">Week</span>' +
            '<span class="ttview' + (tt.view === 'day' ? ' on' : '') + '">Day</span>' +
          '</div>' +
          '<span class="ttfold' + (tt.open === false ? ' shut' : '') + '">' + TT_CHEV + '</span>' +
        '</div>' + body +
      '</section>' + nowCard(hint);
  }

  /* What the cached week says about a day with no lessons in the snapshot.

     Three shimmering blocks were the only answer here, which on a Saturday is a
     teacher watching a page pretend to load lessons that are never coming. The week
     is matched by date first and by weekday second — a timetable repeats, so last
     Saturday answers for this one — and a weekday with no column at all is a weekday
     this teacher does not teach. Only ever said when the week is known; with no
     snapshot to go on the skeleton stands, because "nothing today" and "nothing
     cached" are different things and only one of them is news.
     It stays hedged: the card above it still says the app is checking. */
  function ttNothing(tt, iso, d){
    if (!tt || !(tt.days || []).length) return '';
    var dow = SHORT[d.getDay()], col = null;
    (tt.days || []).forEach(function (x) {
      if (x.date === iso) col = x;
      else if (!col && x.dow === dow) col = x;
    });
    if (col && (col.lessons || []).length) return '';   // it has lessons: not this case
    var why = (col && col.holiday) ? col.holiday : 'No lessons on ' + DAYS[d.getDay()];
    return '<div class="nolsn">' + esc(why) + '</div>';
  }

  /* ---- the bottom tabs, from the set the app left behind ----
     Paths copied from App.html's <nav class="tabs">. Every open lands on Home. */
  var TAB_BAR = {
    home:   ['Home', '<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5"/>'],
    plan:   ['Weekly Plan', '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M7.5 13.5h4M7.5 16.5h7"/>'],
    tt:     ['Timetable', '<rect x="3.5" y="4.5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.75h17M9.25 9.5V20M14.75 9.5V20"/>'],
    res:    ['Resources', '<path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.6l2 2.2h7.4a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>'],
    grades: ['Gradebook', '<path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/><path d="M9 7.5h6M9 11h4"/>']
  };
  // ...and the solid glyph each shows while it is the current tab (I13).
  var TAB_FILL = {
    home: '<path d="M12 3.2 2.9 10.7a.9.9 0 0 0 1.2 1.4l.9-.8V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.7l.9.8a.9.9 0 0 0 1.2-1.4z"/>',
    plan: '<path fill-rule="evenodd" d="M6 5h12a2.5 2.5 0 0 1 2.5 2.5V18a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18V7.5A2.5 2.5 0 0 1 6 5zM7.5 12.6h4v1.8h-4zM7.5 15.6h7v1.8h-7z"/><path class="s" d="M8 3v3M16 3v3"/>',
    tt: '<path fill-rule="evenodd" d="M6 4.5h12A2.5 2.5 0 0 1 20.5 7v10.5A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5V7A2.5 2.5 0 0 1 6 4.5zM3.5 8.8h17v1.4h-17zM3.5 14.05h17v1.4h-17zM8.55 10.2h1.4v3.85h-1.4zM14.05 10.2h1.4v3.85h-1.4zM8.55 15.45h1.4V20h-1.4zM14.05 15.45h1.4V20h-1.4z"/>',
    res: '<path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.6l2 2.2h7.4a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
    grades: '<path fill-rule="evenodd" d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5zM9 6.8h6v1.4H9zM9 10.3h4v1.4H9z"/><path class="s" d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/>'
  };

  function tabList(v){
    if (!Array.isArray(v)) return null;
    var out = ['home', 'plan', 'tt', 'res', 'grades'].filter(function (n) { return v.indexOf(n) !== -1; });
    return out.length ? out : null;
  }
  function tabBar(v){
    var list = tabList(v);
    return !list ? '' : '<div class="tabs" id="instantTabs"><div class="tabs-in">' +
      list.map(function (n) {
        return '<span class="tab" data-tab="' + n + '"' + (n === 'home' ? ' aria-current="page"' : '') + '><span class="ic">' +
          '<svg class="o" viewBox="0 0 24 24">' + TAB_BAR[n][1] + '</svg><svg class="f" viewBox="0 0 24 24">' + TAB_FILL[n] +
          '</svg></span>' + TAB_BAR[n][0] + '</span>';
      }).join('') + '</div></div>';
  }
  // Room under the last card, and the notification bar lifted clear, before the app says so.
  function tabRoom(v){
    var on = !!tabList(v), bar = $('instantTabs');
    $('instant').classList.toggle('hastabs', on);
    if (on && bar && bar.offsetHeight) document.documentElement.style.setProperty('--tabs', bar.offsetHeight + 'px');
  }

  function readSnap(token){
    try {
      var raw = localStorage.getItem(SNAP + token);
      if (!raw) return null;
      var s = JSON.parse(raw);
      return (s && s.v === 1) ? s : null;
    } catch (e) { return null; }
  }
  function writeSnap(token, s){
    try { localStorage.setItem(SNAP + token, JSON.stringify(s)); } catch (e) {}
  }

  /* Store today's day under its date, and also keep the lesson grid under its
     weekday. The timetable repeats weekly, so last Monday's grid is a correct
     preview of this Monday's — the marks are not, which is why only the
     structure is reused and every chip is reset. */
  function absorbSnap(token, msg){
    var s = readSnap(token) || { v:1, days:{}, dow:{} };
    // tt is the shape of the week, for the card this page now draws itself; strip is
    // still kept as the fallback height for snapshots written before it, and for the
    // gap when a teacher has no timetable at all.
    s.meta = { school: msg.school, teacher: msg.teacher, strip: msg.strip,
               tt: msg.tt || (s.meta && s.meta.tt) || null, fold: !!msg.fold,
               // Absent (not null) from an older app build, so paintCached can tell the two apart.
               tabs: msg.tabs === undefined ? undefined : tabList(msg.tabs) };
    s.days = s.days || {}; s.dow = s.dow || {}; s.dowAt = s.dowAt || {};
    if (msg.day && msg.day.date) {
      msg.day.savedAt = Date.now();
      s.days[msg.day.date] = msg.day;
      /* Key the weekday grid by the same three-letter weekday paintCached reads.
         dayShort is a DISPLAY string from the server — "Friday 28 Aug" — so keying
         on it wrote the grid under one name and read it under another, and the two
         never met. That silently disabled the fallback that matters most: the first
         open of each morning, when there is no snapshot for today yet. Deriving the
         key from the day's own date cannot drift from the label's format. */
      var dow = SHORT[asDate(msg.day.date).getDay()];
      if (dow) {
        s.dow[dow] = msg.day.lessons || [];
        s.dowAt[dow] = Date.now();                    // how old this class list is
      }
      // Drop anything written under the old display-string key.
      Object.keys(s.dow).forEach(function (k) {
        if (SHORT.indexOf(k) === -1) { delete s.dow[k]; delete s.dowAt[k]; }
      });
      var keys = Object.keys(s.days).sort();
      while (keys.length > KEEP_DAYS) delete s.days[keys.shift()];
    }
    writeSnap(token, s);
  }

  /* ---- a student's own figures ------------------------------------------- */

  /**
   * Students had no cached screen at all: every open waited out the whole cold start,
   * every single time, because the only snapshot the app ever posted was a teacher's
   * register grid. This is the same idea pointed at the other role — their own totals,
   * on their own device, replaced by the live figures moments later.
   */
  /* Normally the live figures land a second later and nobody reads this line. But if
     the app never loads at all, this is the only screen that can sit there showing old
     numbers, and "updating" alone would not admit how old. Anything not from today
     names its day; a calendar day, not 24 hours, because "last seen on 12 Sep" is what
     a person means when they ask when they last looked. */
  function seenNote(s){
    var at = Number(s.at || 0);
    if (at) {
      var d = new Date(at), now = new Date();
      if (d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth()
          || d.getDate() !== now.getDate())
        return 'Last seen on ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' &middot; updating';
    }
    // No stamp means it was stored before this page learned to date them: one open.
    return 'Your last view &middot; updating';
  }

  function paintStudent(token){
    var s;
    try { s = JSON.parse(localStorage.getItem(STU + token) || 'null'); } catch (e) { return false; }
    if (!s || !s.totals) return false;

    var t = s.totals;
    var pct = function (v) { return Math.round((v || 0) * 100) + '%'; };
    var row = function (label, x, muted) {
      return '<div class="srow' + (muted ? ' past' : '') + '">' +
        '<span class="slab">' + esc(label) + '</span>' +
        '<span class="sfig">' + (x.total || 0) + ' lessons</span>' +
        '<span class="spct">' + pct(x.rate) + '</span></div>';
    };

    $('instantInner').innerHTML =
      headBar(s.school, s.name) +
      // One block in reading order: #instantInner orders its children for the teacher's
      // Home, and left loose these landed above the name with the gap at the foot (W1).
      '<div class="stuwrap"><div class="dhead"><i class="eye">' + esc(s.school || '') + '</i><b>' + esc(s.name || '') + '</b><span>' +
        esc(['Year ' + (s.year || ''), s.option, s.rangeLabel].filter(Boolean).join(' · ')) +
      '</span></div>' +
      '<div class="note"><span class="spin"></span>' + seenNote(s) + '</div>' +
      stripGap(s.strip) +
      '<div class="stot"><b>' + pct(t.rate) + '</b><span>' + (t.present || 0) + ' present · ' +
        (t.late || 0) + ' late · ' + (t.absent || 0) + ' absent</span></div>' +
      (s.subjects || []).map(function (x) { return row(x.label, x, x.dropped); }).join('') +
      '</div>' + tabBar(s.tabs);

    $('instant').style.display = 'block';
    tabRoom(s.tabs);
    $('shell').classList.add('gone');
    return true;
  }

  /* ---- registers marked before the app finished loading ------------------- */

  function readQueue(token){
    try { return JSON.parse(localStorage.getItem(QUEUE + token) || '[]') || []; }
    catch (e) { return []; }
  }
  function writeQueue(token, q){
    try { localStorage.setItem(QUEUE + token, JSON.stringify(q)); } catch (e) {}
  }
  function sameLesson(a, b){
    return a.classId === b.classId && a.date === b.date && String(a.period) === String(b.period);
  }
  /* One entry per lesson: marking it twice before it syncs replaces, never duplicates. */
  function queueAdd(token, item){
    var q = readQueue(token).filter(function (x) { return !sameLesson(x, item); });
    q.push(item);
    writeQueue(token, q);
  }
  function queueDrop(token, m){
    writeQueue(token, readQueue(token).filter(function (x) { return !sameLesson(x, m); }));
  }
  function queuedFor(token, l, iso){
    var q = readQueue(token);
    for (var i = 0; i < q.length; i++) {
      if (sameLesson(q[i], { classId: l.classId, date: iso, period: l.period })) return q[i];
    }
    return null;
  }

  /* ---- rendering the cached view ----------------------------------------- */

  var DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var SHORT  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function todayIso(){ var d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
  // midday avoids any daylight-saving edge shifting the day by one
  function asDate(iso){ return new Date(iso + 'T12:00:00'); }
  // Must match ini() in App.html exactly: first word + LAST word. When these two
  // disagreed the avatar letters changed the instant the real app faded in, which
  // is the one thing this cached screen exists to prevent.
  function initials(n){
    var p=String(n||'').trim().split(/\s+/);
    return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();
  }

  function chip(l, live, queued){
    if (queued)  return '<span class="chip queued">Saved &middot; syncing</span>';
    if (!live)   return '<span class="chip wait">&hellip;</span>';
    if (l.taken) return '<span class="chip ok">Taken</span>';
    if (l.leave) return '<span class="chip leave">' + esc(l.leave) + '</span>';
    return '<span class="chip todo">To do</span>';
  }
  /* Tappable only when we hold a class list for it that is recent enough to type
     into, and the lesson is not someone else's cover. */
  function markable(l, fresh){
    return !!(fresh && l.students && l.students.length && !l.leave);
  }
  /* The app's day summary (daySummary in App.html): taken out of expected, one bar, its key.
     Drawn at the same size so nothing moves when the app lands. Counts only from today's own
     snapshot; from a weekday's grid it never guesses, and every lesson is simply to do. */
  function dsum(lessons, live){
    var t = { taken: 0, excused: 0, todo: 0 };
    lessons.forEach(function (l) {
      if (live && l.taken) t.taken++; else if (l.leave) t.excused++; else t.todo++;
    });
    var need = t.taken + t.todo;
    var seg = function (n, k) { return n ? '<i class="' + k + '" style="flex:' + n + '"></i>' : ''; };
    var key = function (n, k, w) { return n ? '<span><i class="' + k + '"></i>' + n + ' ' + w + '</span>' : ''; };
    return '<div class="dsum"><span class="lab">Registers</span>' +
      '<span class="dsfig">' + (need ? '<b>' + t.taken + '</b>/' + need + ' taken' : 'All excused') + '</span>' +
      '<span class="dsbar">' + seg(t.taken, 'taken') + seg(t.excused, 'excused') + seg(t.todo, 'todo') + '</span>' +
      '<span class="dskey">' + key(t.taken, 'taken', 'taken') + key(t.excused, 'excused', 'excused') +
        key(t.todo, 'todo', 'to do') + '</span></div>';
  }

  function card(l, admin, live, i, fresh, queued){
    var sub = [ (l.start ? l.start + '-' + l.end : ''), l.room, (admin ? l.teacher : '') ]
      .filter(Boolean).join(' \u00b7 ');
    var count = queued ? 'register ready'
              : (live && l.taken) ? (l.flagged + '/' + l.total + ' flagged')
                                  : (l.total + ' students');
    var tap = markable(l, fresh);
    return '<' + (tap ? 'button type="button"' : 'div') +
      ' class="lsn' + (l.leave && !l.taken ? ' leave' : '') + (tap ? ' tap' : '') + '"' +
      (l.tone ? ' data-tone="' + esc(l.tone) + '"' : '') +
      (tap ? ' data-i="' + i + '"' : '') + '>' +
      '<div class="per"><b>' + esc(l.period) + '</b><span>Per</span></div>' +
      '<div class="mid"><div class="t">' + esc(l.label) + '</div>' +
      '<div class="s">' + esc(sub) + '</div></div>' +
      '<div class="end">' + chip(l, live, queued) + '<span class="n">' + esc(count) + '</span></div>' +
      '</' + (tap ? 'button' : 'div') + '>';
  }

  /**
   * Paint whatever the device already knows. Returns true if anything was drawn.
   * Three levels, in order of preference:
   *   1. today's own snapshot     -> real cards, real chips
   *   2. the same weekday's grid  -> real cards, chips reset to "…"
   *   3. name and date only       -> skeleton cards underneath
   * It never guesses attendance: a chip only appears when it came from today.
   */
  function paintCached(token){
    var s = readSnap(token);
    if (!s || !s.meta) return false;

    var iso = todayIso(), d = asDate(iso);
    var day = s.days && s.days[iso];
    var live = !!day;
    var at = day ? day.savedAt : 0;
    var key = SHORT[d.getDay()];
    var proto = (s.dow && s.dow[key]) || [];
    if (!day) {
      if (proto.length) { day = { lessons: proto }; at = (s.dowAt && s.dowAt[key]) || 0; }
    } else if (day.lessons && day.lessons.length && proto.length) {
      /* Today's snapshot wins on WHICH lessons there are and on the chips, but it may
         carry no class lists — it was written by an older build, or before the offline
         register was switched on. The weekday grid may hold the names for those same
         lessons. Graft them across rather than making the teacher wait out a cold start
         for a roster the device already has. This is what a deploy looks like from the
         inside: real cards that were mysteriously not tappable until the app had run
         once more. */
      var borrowed = false;
      day.lessons.forEach(function (l) {
        if (l.students && l.students.length) return;
        for (var i = 0; i < proto.length; i++) {
          var p = proto[i];
          if (p.classId === l.classId && String(p.period) === String(l.period) &&
              p.students && p.students.length) { l.students = p.students; borrowed = true; return; }
        }
      });
      // Borrowed names are only as fresh as the grid they came from.
      if (borrowed) at = Math.min(at || 0, (s.dowAt && s.dowAt[key]) || 0);
    }
    // Old enough that someone may have joined or left the class since.
    var fresh = !!at && (Date.now() - at) < ROSTER_DAYS * 864e5;

    var admin = !!(s.meta.teacher && s.meta.teacher.admin);
    var name  = (s.meta.teacher && s.meta.teacher.name) || '';
    var lessons = (day && day.lessons) || [];
    var anyTap = lessons.some(function (l) { return markable(l, fresh); });

    QS.token = token;
    QS.lessons = lessons;
    QS.admin = admin;
    QS.live = live;
    QS.fresh = fresh;
    QS.iso = iso;
    var hint = anyTap ? READY
             : live ? 'Your last view · updating' : 'Your usual timetable · checking today';
    // An older snapshot has no set, but still knows the role: a non-admin teacher has all three.
    var tabs = s.meta.tabs !== undefined ? s.meta.tabs : (admin ? null : ['home', 'plan', 'grades']);
    var ttHtml = ttCard(s.meta.tt, s.meta.strip, iso, d, hint, !!tabs && tabs.indexOf('tt') !== -1, s.meta.fold);

    var html =
      headBar(s.meta.school, name) +
      // The week, drawn from the app's own copy of it; a plain held-open gap when
      // there is no copy to draw.
      ttHtml +
      '<div class="dhead"><i class="eye">' + esc(s.meta.school || '') + '</i><b>' + esc(DAYS[d.getDay()]) + '</b><span>' +
        esc(d.getDate() + ' ' + MONTHS[d.getMonth()]) + '</span></div>' +   // no year, as the app (H14)
      // The card above says it when there is one; the pill is only for the bare gap.
      (ttHtml.indexOf('ttnow') === -1 ? '<div class="note">' + (hint === READY ? '' : '<span class="spin"></span>') + esc(hint) + '</div>' : '');

    if (lessons.length) {
      html += dsum(lessons, live) + '<div class="lessons">' +
        lessons.map(function (l, i) {
          return card(l, admin, live, i, fresh, !!queuedFor(token, l, iso));
        }).join('') +
        '</div>';
    } else {
      var nothing = ttNothing(s.meta.tt, iso, d);
      html += nothing ||
        '<div class="sblock hlsn"></div><div class="sblock hlsn"></div><div class="sblock hlsn"></div>';
    }

    $('instantInner').innerHTML = html + tabBar(tabs);
    $('instant').style.display = 'block';
    tabRoom(tabs);
    $('shell').classList.add('gone');
    return true;
  }

  /* The app's header, drawn still (W7, I3): the account and its Live dot, nothing else. */
  function headBar(school, name) {
    return '<div class="sbar"><span class="slogo">' + esc(school || 'KS5 Hub') + '</span>' +
      '<span class="name"><span class="avatar">' + esc(initials(name)) + '</span></span></div>';
  }

  /* ---- the register the teacher can take while Apps Script is still starting ---- */

  var QS = { token:'', lessons:[], admin:false, live:false, fresh:false, iso:'',
             lesson:null, marks:{}, editing:false, ready:false, frame:null, onDone:null };

  function repaintCards(){
    if (!QS.lessons.length) return;
    var host = $('instantInner').querySelector('.lessons');
    if (!host) return;
    host.innerHTML = QS.lessons.map(function (l, i) {
      return card(l, QS.admin, QS.live, i, QS.fresh, !!queuedFor(QS.token, l, QS.iso));
    }).join('');
  }

  function openQuick(i){
    var l = QS.lessons[i];
    if (!l || !markable(l, QS.fresh)) return;
    QS.lesson = l;
    QS.marks = {};
    var prev = queuedFor(QS.token, l, QS.iso);
    l.students.forEach(function (st) {
      QS.marks[st.id] = (prev && prev.statuses && prev.statuses[st.id]) || 'P';
    });
    QS.editing = true;
    $('quick').style.display = 'block';
    $('instant').style.display = 'none';
    renderQuick();
  }
  function closeQuick(){
    QS.editing = false;
    QS.lesson = null;
    $('quick').style.display = 'none';
    $('instant').style.display = 'block';
    repaintCards();
    // The app may have finished loading while they were marking; only now is it
    // safe to swap the screen out from under them.
    if (QS.ready && QS.onDone) QS.onDone();
  }

  /* The app's own cycle and wording, so a teacher is not learning a second register.
     Each status is an icon and its word (the app's TILEWORD), so Present reads the same
     way as Late and Absent instead of being the blank one. */
  var CYCLE = { P: 'A', A: 'L', L: 'P' };
  var WORD  = { P: 'Present', A: 'Absent', L: 'Late' };
  var TILEWORD = {

     sheet, the browser goes on holding the old one; getSubscription() hands it straight
     back, we re-register it, and every push to it is refused for the rest of time — and
     invisibly, because re-registering a dead subscription looks exactly like a healthy
     one from in here. The person would have had to clear site data to escape, which is
     not a thing you can ask a teacher to do. */
  function keyStillOurs(sub) {
    try {
      var was = sub.options && sub.options.applicationServerKey;
      if (!was) return true;            // browser will not tell us: leave well alone
      var a = new Uint8Array(was), b = b64ToBytes(PUSH.vapid);
      /* Only ever act on a key we are sure of. An uncompressed P-256 point is 65 bytes
         and nothing else is; if what we hold is not one — truncated, still arriving,
         mangled in transit — then every comparison below would come out "different" and
         we would throw away a perfectly good subscription on every single load, quietly,
         forever. Saying "leave it alone" when unsure costs nothing by comparison. */
      if (b.length !== 65) return true;
      if (a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    } catch (e) { return true; }
  }

  function subscribeAndRegister() {
    if (!PUSH.reg || !PUSH.vapid) return;
    function fresh() {
      return PUSH.reg.pushManager.subscribe({
        userVisibleOnly: true,          // required, and iOS refuses silent pushes outright
        applicationServerKey: b64ToBytes(PUSH.vapid)
      });
    }
    PUSH.reg.pushManager.getSubscription()
      .then(function (existing) {
        if (!existing) return fresh();
        if (keyStillOurs(existing)) return existing;
        // Stale: drop it and take a new one, which needs no permission prompt.
        return existing.unsubscribe().catch(function () {}).then(fresh);
      })
      .then(function (sub) {
        var device = (/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'iOS'
          : /Android/.test(navigator.userAgent) ? 'Android' : 'desktop');
        toApp({ type: 'attendance:push-subscribe', v: 1,
                sub: JSON.parse(JSON.stringify(sub)), device: device });
      })
      .catch(function () {});
  }

  /* The app has loaded and told us the application server key. */
  /* Why the offer is not on screen.

     Every branch below used to be a bare `return`, and `register().catch` swallowed the
     rest — six silent exits and a shrug. That is fine on an ordinary load, where nobody
     wants an explanation of a button they were not looking for. It is useless to the
     person who has been told to turn notifications on and cannot see how.

     So: silent as before by default, but with ?notify=1 on the address the bar appears
     anyway and states the reason. One link diagnoses it, on the device that has the
     problem, without anyone reading a console. */
  function pushWhyNot(reason) {
    if (!/[?&]notify=1/.test(location.search)) return;
    var bar = $('notifBar');
    if (!bar) return;
    $('notifText').textContent = reason + '  [wrapper ' + WRAPPER_BUILD + ']';
    $('notifYes').hidden = true;
    $('notifNo').textContent = 'Close';
    $('notifNo').onclick = function () { away(bar); };
    show(bar);
  }

  /* ---- the notification gate ----
     Notifications are required. gate(kind) covers the app until this device can receive
     them; the server's reachable flag (pushOn) lets a second device through once the
     person is reachable on another — they have enabled notifications, just not here. */
  /* Each step is an icon and a few words, the icon being the thing to look for on the
     phone (W3, W4): "Tap Share" beside the Share glyph reads at a glance where a sentence
     about it had to be read through. The step text is fixed markup written here, never
     anything that came in from outside, so it goes in as HTML for its bold words. */
  var GI = {
    bell: '<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    reg: '<rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2.5v3M16 2.5v3"/><path d="M8.5 13l2.5 2.5 4.5-5"/>',
    plan: '<path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.5V8h4"/><path d="M8.5 12.5h7M8.5 16h5"/>',
    share: '<path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/>',
    add: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/>',
    set: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    toggle: '<rect x="2.5" y="6.5" width="19" height="11" rx="5.5"/><circle cx="16" cy="12" r="3.2"/>',
    more: '<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',
    open: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    phone: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>'
  };
  function gic(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + GI[n] + '</svg>'; }
  // The app's own icon: the last step is finding it, so it shows the real thing.
  var APPIC = '<img src="./icon-192.png" alt="" width="26" height="26">';
  var GATE = {
    // Two tiles say what the notifications are FOR, which is the whole case for saying yes.
    ask: { title: 'Turn on notifications', go: 'Turn on', body: 'KS5 Hub needs them to reach you.',
      why: [['reg', 'Register due'], ['plan', 'Plan is out']], steps: [] },
    install: { title: 'Add to Home Screen', go: '',
      body: 'iPhone only sends notifications to apps on the Home Screen.',
      steps: [[gic('share'), 'Tap <strong>Share</strong> in Safari'], [gic('add'), '<strong>Add to Home Screen</strong>'],
              [APPIC, 'Open <strong>KS5 Hub</strong> from it']] },
    blocked: { title: 'Notifications are blocked', go: 'I\u2019ve turned them on', warn: true,
      body: 'Only your settings can turn them back on.',
      steps: [[gic('set'), 'Open <strong>Settings</strong>, then <strong>Notifications</strong>'],
              [APPIC, 'Find <strong>KS5 Hub</strong> (or this browser)'], [gic('toggle'), 'Turn on <strong>Allow Notifications</strong>']] },
    unsupported: { title: 'Open this in Safari or Chrome', go: 'Copy my link',
      body: 'This browser can\u2019t show notifications, most often because the link opened inside another app.',
      steps: [[gic('more'), 'Tap <strong>\u22ef</strong> or <strong>Share</strong>'],
              [gic('open'), 'Choose <strong>Open in Safari</strong> or <strong>Chrome</strong>'],
              [gic('phone'), 'Older iPhone? Update to <strong>iOS 16.4</strong>']] }
  };
  function gate(kind) {
    var g = GATE[kind], box = $('gate');
    if (!g || !box) return;
    $('gateTitle').textContent = g.title;
    $('gateBody').textContent = g.body;
    $('gateWhy').innerHTML = (g.why || []).map(function (x) {
      return '<span class="gw"><i>' + gic(x[0]) + '</i>' + esc(x[1]) + '</span>';
    }).join('');
    $('gateSteps').innerHTML = g.steps.map(function (x, i) {
      return '<li><b>' + (i + 1) + '</b><span class="gs">' + x[1] + '</span><span class="gi" aria-hidden="true">' + x[0] + '</span></li>';
    }).join('');
    $('gateIcon').className = 'gtile' + (g.warn ? ' warn' : '');
    $('gateLink').hidden = true;
    $('gateWho').textContent = PUSH.name ? 'Signed in as ' + PUSH.name : '';
    var go = $('gateGo');
    go.hidden = !g.go;
    go.textContent = g.go;
    go.onclick = kind === 'ask' ? function () {
      // Straight from the tap: the permission prompt needs that user activation.
      Notification.requestPermission().then(function (p) {
        if (p === 'granted') { ungate(); subscribeAndRegister(); }
        else if (p === 'denied') gate('blocked');
      });
    } : kind === 'blocked' ? function () { location.reload(); }
      : kind === 'unsupported' ? function () {
        var link = location.origin + location.pathname + '?t=' + encodeURIComponent(PUSH.token || stored());
        var done = function () { go.textContent = 'Link copied'; };
        /* No clipboard (some in-app browsers refuse it): the link goes in the card, selected,
           for a long-press Copy — never the browser's own prompt box, which looks like an
           error from somewhere else and is the one thing on screen not in the app's style. */
        var show = function () {
          var f = $('gateLink');
          f.value = link; f.hidden = false;
          go.textContent = 'Copy the link above';
          try { f.focus(); f.select(); f.setSelectionRange(0, link.length); } catch (e) {}
        };
        try { navigator.clipboard.writeText(link).then(done, show); }
        catch (e) { show(); }
      } : null;
    $('gateOut').onclick = function () { signOut(PUSH.name); };
    show(box);
    mark('notification gate: ' + kind);
  }
  function ungate() { away($('gate')); }

  function pushReady(vapid, token) {
    PUSH.token = token || '';
    /* Which of the four the device is in. An iPhone browser tab first: it has no Push API
       until the app is installed, so it would otherwise look like an unsupported browser. */
    var iOSdev = /iPhone|iPad|iPod/.test(navigator.userAgent);
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                     navigator.standalone === true;
    var noPush = !('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window);
    if (noPush && !PUSH.reachable) {
      if (iOSdev && !standalone) gate('install'); else gate('unsupported');
    }
    if (!('serviceWorker' in navigator)) {
      return pushWhyNot('This browser cannot show notifications (no service worker support).');
    }
    if (!('PushManager' in window) || !('Notification' in window)) {
      return pushWhyNot('This browser has no Push API. On an iPhone the app must be opened ' +
        'from its home-screen icon, not a Safari tab.');
    }
    if (!vapid) {
      return pushWhyNot('The app did not send a notification key. The office needs to redeploy ' +
        'the web app, then run Attendance > Notifications > Check notifications can work.');
    }
    PUSH.vapid = vapid;
    PUSH.token = token || '';

    /* "Not now" holds until the office asks again. It was remembered forever at first, so
       one tap made someone unreachable for good; then it lasted a day, which nagged. Now
       the office sets the pace: Attendance > Notifications > Ask everyone again starts a
       new round, doGet hands its id over as askRound, and a device that said "Not now" in
       an earlier round sees the bar again — once. Once this device has said yes its
       permission is 'granted', and that branch below returns before any of this is
       consulted, so the bar never shows again.

       Compared for equality, not order: the only question is "has there been a round
       since?". A value an older build wrote — '1' meaning never, or a date from the daily
       snooze — matches no round, so it is asked once more and then settles. */
    var round = String(PUSH.round || '0');
    var diag = /[?&]notify=1/.test(location.search);
    var snoozed = function (kind) {
      if (diag) return false;
      try { return localStorage.getItem(PUSHKEY + kind) === round; } catch (e) { return false; }
    };
    var snooze = function (kind) {
      try { localStorage.setItem(PUSHKEY + kind, round); } catch (e) {}
    };
    /* Reachable on ANOTHER device already: the server says this person has a live
       subscription somewhere. Enabling once is enough — asking again on every laptop and
       tablet they happen to open this on is nagging someone who already said yes, and a
       round never reaches them either. The server keeps it honest: every send deletes a
       device its push service reports gone, so a person whose only device has died stops
       counting as reachable — asked at once on a device that never said "Not now", or at
       the next round on one that did. */
    var elsewhere = !!PUSH.reachable && !diag;

    /* iOS grants the Push API to an INSTALLED app only. Offering a button that cannot
       work, to exactly the people most likely to tap it, is worse than staying quiet. */
    var iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    var installed = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                    navigator.standalone === true;
    if (iOS && !installed) {
      /* Apple grants the Push API only to an installed app, so asking here could not work.
         Installing is the single step that makes it work: the gate says how. */
      if (!elsewhere) gate('install');
      return;
    }

    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      PUSH.reg = reg;
      var known = '';
      try { known = localStorage.getItem(PUSHKEY + PUSH.token) || ''; } catch (e) {}
      tellWorker(known);

      if (Notification.permission === 'granted') {
        /* Re-subscribe on every load. iOS quietly drops subscriptions after a reinstall
           or a long gap, and from in here a dead one looks exactly like a live one. */
        subscribeAndRegister();
        if (!/[?&]notify=1/.test(location.search)) return;
        var gb = $('notifBar');
        if (!gb) return;
        $('notifText').textContent = 'Notifications are on for this device  [wrapper ' +
          WRAPPER_BUILD + ']. Not receiving them? Draw one here without any push involved:';
        pushLastResult(function (extra) {
          if (extra) $('notifText').textContent += extra;
        });
        $('notifYes').hidden = false;
        $('notifYes').textContent = 'Show a test';
        $('notifYes').onclick = pushLocalTest;
        $('notifNo').textContent = 'Close';
        $('notifNo').onclick = function () { away(gb); };
        show(gb);
        return;
      }
      if (Notification.permission === 'denied') {
        if (!elsewhere) gate('blocked');
        return pushWhyNot('Notifications are blocked for this app in your device settings. ' +
          'Turn them back on there — a web page is not allowed to ask again.');
      }
      // Not asked yet (or the prompt was dismissed): required, so the gate asks.
      if (!elsewhere) gate('ask');
    }).catch(function (err) {
      pushWhyNot('The notification helper (sw.js) did not load: ' + (err && err.message || err) +
        '. It must sit on the website beside index.html — open /sw.js in a browser to check.');
    });
  }

  /* The app wrote the subscription to the sheet and sent back the device key. */
  function pushRegistered(key) {
    if (!key) return;
    try { localStorage.setItem(PUSHKEY + PUSH.token, key); } catch (e) {}
    tellWorker(key);
  }

  if ('serviceWorker' in navigator && navigator.serviceWorker.addEventListener) {
    navigator.serviceWorker.addEventListener('message', function (e) {
      var m = e && e.data;
      if (!m || m.type !== 'attendance:open-tab' || !/^(plan|res|grades)$/.test(String(m.tab || ''))) return;
      if (QS.ready) toApp({ type: 'attendance:tab', v: 1, tab: m.tab });
      else QS.tab = m.tab;
    });
  }
  // The tab has been read; it should not be asked for again on a reload.
  if (WANT_TAB) {
    try {
      var qs = location.search.replace(/^\?/, '').split('&').filter(function (kv) { return kv && kv.split('=')[0] !== 'tab'; });
      history.replaceState(null, '', location.pathname + (qs.length ? '?' + qs.join('&') : ''));
    } catch (e) {}
  }

  /* Sign out: forget this person on this device, stop this device's notifications for
     them, and come back to the sign-in screen. Registers still waiting to be sent stay
     queued under their code, and go the next time that person signs in here. */
  function signOut(name) {
    var tk = stored();
    try { sessionStorage.setItem('attendance-signedout', String(name || '').slice(0, 80) || '1'); } catch (e) {}
    try {
      [SNAP, STU, TABC, ADMC, SHELLS, BOOTS, PUSHKEY].forEach(function (p) { localStorage.removeItem(p + tk); });
      localStorage.removeItem(KEY);
    } catch (e) {}
    var go = function () { location.replace(location.pathname); };
    try {
      if (!('serviceWorker' in navigator)) return go();
      navigator.serviceWorker.getRegistration()
        .then(function (r) { return r && r.pushManager ? r.pushManager.getSubscription() : null; })
        .then(function (sub) { return sub ? sub.unsubscribe() : null; })
        .then(go, go);
      setTimeout(go, 1500);                 // never wait on a push service to leave
    } catch (e) { go(); }
  }
  /* A whole link or just its code: take the t= out of a link, and trim either. */
  function codeFrom(v) {
    v = String(v || '').trim();
    var m = v.match(/[?&#]t=([^&#\s]+)/);
    if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
    return /^[A-Za-z0-9_-]{6,}$/.test(v) ? v : '';
  }

  /* The admin dashboard (invariant 46). Opened in a tab of its own it meets the same
     multi-account bug the app does ("Sorry, unable to open the file at this time"), so
     it gets the app's cure: this page's frame, cookie-free where the browser can. The
     token stays on this device; ?admin=1 says only which page to show. */
  /* The dashboard keeps its last answer here, like the app's tabs keep theirs in TABC: its
     frame is credentialless, so anything it stored itself went with the page and every
     open sat on "Loading the sheet…" until Apps Script answered. Per token, one record,
     bounded; the page sends it without anyone's link in it (see Admin.html). */
  var ADMC_BYTES = 2500000;
  function readAdminCache(token){
    var o = readJSON(ADMC + token);
    return (o && o.v === 1 && o.data && typeof o.data === 'object') ? o : null;
  }
  function writeAdminCache(token, m){
    var rec = { v: 1, at: Date.now(), tab: typeof m.tab === 'string' ? m.tab.slice(0, 20) : '', data: m.data };
    if (!m.data || typeof m.data !== 'object') {
      // Only the section changed: keep the answer we have.
      var have = readAdminCache(token);
      if (!have) return;
      rec.data = have.data; rec.at = have.at;
    }
    var text = JSON.stringify(rec);
    if (text.length > ADMC_BYTES) return;
    try { localStorage.setItem(ADMC + token, text); }
    catch (e) { try { localStorage.removeItem(ADMC + token); } catch (e2) {} }
  }
  function openAdmin(t) {
    $('ask').style.display = 'none';
    $('shell').classList.add('gone');
    document.title = 'Admin';
    var el = document.createElement('iframe');
    el.id = 'admin';
    el.title = 'Admin dashboard';
    el.setAttribute('allow', 'clipboard-write');
    try { if ('credentialless' in HTMLIFrameElement.prototype) el.credentialless = true; } catch (e) {}
    el.className = 'ready';
    /* The theme the person picked in the app, on the URL, exactly as the app's own frame
       gets it. Without it the dashboard only ever saw the phone's setting: an app set to
       Light on a phone in dark mode opened a dark dashboard, every time. */
    var themed = '';
    try {
      var pref = localStorage.getItem('attendance-theme');
      if (pref === 'dark' || pref === 'light') themed = '&theme=' + pref;
    } catch (e) {}
    el.src = WEBAPP_URL + '?admin=1&in=1&t=' + encodeURIComponent(t) + themed;
    document.body.appendChild(el);
    // Apps Script nests the page a frame or two inside ours: anything posted from under
    // our frame is the dashboard; anything else (an opener, another tab) is not.
    function fromAdmin(w) {
      for (var i = 0; w && i < 6; i++) {
        if (w === el.contentWindow) return true;
        if (w === w.parent) return false;
        w = w.parent;
      }
      return false;
    }
    window.addEventListener('message', function (e) {
      var m = e && e.data;
      if (!m || m.v !== 1) return;
      if (m.type === 'attendance:admin-ready' || m.type === 'attendance:admin-cache') {
        if (!e.source || !fromAdmin(e.source)) return;
        if (m.type === 'attendance:admin-cache') { try { writeAdminCache(t, m); } catch (err) {} return; }
        var kept = readAdminCache(t);
        try { e.source.postMessage({ type: 'attendance:admin-cached', v: 1, at: kept ? kept.at : 0,
          tab: kept ? kept.tab : '', data: kept ? kept.data : null }, '*'); } catch (err) {}
        return;
      }
      if (m.type !== 'attendance:admin-back') return;
      var from = '';
      try { from = sessionStorage.getItem('attendance-admin-from') || ''; sessionStorage.removeItem('attendance-admin-from'); } catch (err) {}
      if (from && history.length > 1) history.back(); else location.replace(location.pathname);
    });
  }
  if (/[?&]admin=1(?:&|$)/.test(location.search) && !/[?&]t=/.test(location.search) && stored()) {
    openAdmin(stored());
    return;
  }

  var extra = passthrough();
  var fromLink = (location.search.match(/[?&]t=([^&]+)/) || [])[1] || '';
  if (fromLink) {
    fromLink = decodeURIComponent(fromLink);
    keep(fromLink);
    // drop the code from the address bar, but keep any view the link asked for
    history.replaceState(null, '', location.pathname + (extra ? '?' + extra.substring(1) : ''));
    open(fromLink, extra);
  } else if (stored()) {
    open(stored(), extra);
  } else {
    $('shell').classList.add('gone');
    $('ask').style.display = 'grid';
    var was = '';
    try { was = sessionStorage.getItem('attendance-signedout') || ''; sessionStorage.removeItem('attendance-signedout'); } catch (e) {}
    if (was) {
      $('signedOut').textContent = '\u2713  ' + (was === '1' ? 'Signed out' : 'Signed out of ' + was);
      show($('signedOut'));
    }
    $('askForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = codeFrom($('code').value);
      if (!v) {
        $('codeErr').textContent = $('code').value.trim()
          ? 'That isn\u2019t a KS5 Hub link or code.' : 'Paste your link or code first.';
        return;
      }
      $('codeErr').textContent = '';
      away($('signedOut'));
      keep(v); open(v, extra);
    });
  }
})();

/* The worker, on every load, signed in or not. Chrome on Android offers Install only to a
   page whose worker is already running, and the sign-in screen is exactly where someone
   first meets the site. Push setup later registers the same file and gets this one back. */
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
