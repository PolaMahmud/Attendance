<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B22" media="(prefers-color-scheme: dark)">
<title>Attendance</title>

<script>
/* Settle the theme before anything paints, RESOLVING the system preference to an
   explicit stamp so the stylesheet describes dark once rather than once per source.
   data-theme is always set; data-theme-by says whether the person or the OS decided. */
(function(){
  var t = '';
  try { t = localStorage.getItem('attendance-theme') || ''; } catch (e) {}
  var chosen = (t === 'dark' || t === 'light') ? t : '';
  var dark = chosen ? chosen === 'dark'
    : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-by', chosen ? 'user' : 'system');
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2312283F'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='Arial'>A</text></svg>">

<!-- Start the DNS lookup and TLS handshake for Apps Script now, in parallel with
     parsing this page, rather than when the iframe is created a moment later. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
  /* This page paints the first screen and the app fades in over it, so the two have
     to agree — on the theme, and on the metrics. They cannot share storage (different
     origins), so the app posts its choice here and this page passes it back on the
     iframe URL.

     Every token below is copied from App.html. When one moves, both move, or the
     cached cards jump the moment the live app arrives. */
  :root{
    --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#E8EBF1;
    --ink:#12151C; --ink-2:#5A6373; --ink-3:#646D7C;
    --line:#DDE1E9; --line-2:#C6CCD8;

    --accent:#3446C8; --accent-hover:#2A38A8; --accent-ink:#FFFFFF;
    --accent-soft:#E9ECFB; --accent-line:#C3CBF2;

    --low:#9A5407;  --low-soft:#FDF0DE;  --low-line:#EFD3AC;
    --full:#A81E17; --full-soft:#FDECEA; --full-line:#F0C4C0;
    --ok:#0A6B4B;   --ok-soft:#E3F4EC;   --ok-line:#BCE0D2;

    --r-lg:14px; --r-md:10px; --r-sm:8px;
    --shadow:0 1px 2px rgba(18,21,28,.05);
    --sheen:rgba(18,21,28,.05);

    /* The shell's own JS writes var(--late) and var(--absent) into the legend
       swatches inline, so those two names have to survive. Declared literally in
       both themes rather than aliased to --low / --full: an alias resolves against
       whichever value wins on :root, which is correct but easy to break silently. */
    --late:#9A5407; --absent:#A81E17;
    --ground:#EEF0F4;

    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --display:var(--sans);
  }
  :root[data-theme="dark"]{
    --bg:#0F1218; --surface:#171B22; --surface-2:#1E232B; --surface-3:#262C36;
    --ink:#E8EBF1; --ink-2:#9BA5B4; --ink-3:#8791A1;
    --line:#272D37; --line-2:#39414E;

    --accent:#8496FF; --accent-hover:#9EACFF; --accent-ink:#0B0E14;
    --accent-soft:#1D2440; --accent-line:#333D6B;

    --low:#E3AA63;  --low-soft:#2A1F0F;  --low-line:#503C1D;
    --full:#F58A7E; --full-soft:#2E1815; --full-line:#552822;
    --ok:#5CC79B;   --ok-soft:#0F2A20;   --ok-line:#1E4B38;

    --late:#E3AA63; --absent:#F58A7E;
    --ground:#0F1218;

    --shadow:0 1px 2px rgba(0,0,0,.4);
    --sheen:rgba(255,255,255,.06);
  }

  /* App.html has this in its shared block and this file never did, so anything with
     width:100% plus padding was rendering wider than its container: the lesson card
     (347 + 26 + 2 = 375 in a 347 track), the code input and the save buttons. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  /* pointer-events is the load-bearing half of this rule, not opacity.
     The frame is fixed at inset:0 above the cached screen, so at opacity:0 it is
     invisible AND still swallows every tap — the cards underneath render correctly,
     read as tappable, and simply never receive a finger. It must not take input
     until it is the thing on screen. */
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2;opacity:0;
    pointer-events:none;transition:opacity .25s ease}
  iframe.ready{opacity:1;pointer-events:auto}

  /* ---- placeholder layer: either the skeleton or the cached cards ---- */
  .ph{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 24px);
    transition:opacity .25s ease}
  .ph.gone{opacity:0;pointer-events:none}
  .inner{max-width:880px;margin:0 auto}

  .sbar{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
  .slogo{font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--ink)}
  .spill{width:74px;height:26px;border-radius:99px;background:var(--surface-3)}
  .sdot{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--surface-3)}
  .sblock{border-radius:var(--r-lg);background:var(--surface-3);
    margin-bottom:9px;overflow:hidden;position:relative}
  .sblock::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,var(--sheen) 50%,transparent 80%);
    background-size:220% 100%;animation:sh 1.4s linear infinite}
  @keyframes sh{from{background-position:180% 0}to{background-position:-80% 0}}
  /* Measured off the live app: .lsn is 68px on a 9px grid, .datebar is 47px. If those
     change in App.html they change here, or the skeleton resizes under the teacher. */
  .hlsn{height:68px}.hday{height:47px}

  /* ---- cached view: mirrors the app's own cards so the swap is invisible ---- */
  .name{margin-left:auto;display:flex;align-items:center;gap:8px}
  .name .nm{font-size:13px;font-weight:500;color:var(--ink-2)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);
    display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
  .dhead{text-align:center;margin:2px 0 12px}
  .dhead b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .dhead span{font-size:12.5px;color:var(--ink-2)}
  .note{display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12px;color:var(--ink-2);margin:0 auto 12px;padding:5px 12px;width:max-content;
    max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
  .spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-2);
    border-top-color:var(--ink-3);animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  .lessons{display:grid;gap:9px}
  @media(min-width:640px){.lessons{grid-template-columns:1fr 1fr}}
  .lsn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 13px;
    box-shadow:var(--shadow);pointer-events:none;color:var(--ink);font-family:inherit}
  .lsn .per{width:42px;height:42px;flex:none;border-radius:var(--r-sm);background:var(--surface-2);
    border:1px solid var(--line);display:grid;place-content:center;text-align:center}
  .lsn .per b{display:block;font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums}
  .lsn .per span{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink-3);margin-top:2px}
  .lsn .mid{flex:1;min-width:0}
  .lsn .mid .t{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .lsn .mid .s{font-size:12.5px;color:var(--ink-2);margin-top:1px}
  /* Grid items default to min-width:auto, so a card whose chip will not wrap grows
     past its own track instead of shrinking. Same rule as App.html. */
  .lessons>*{min-width:0}
  .lsn .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;
    min-width:0;max-width:58%}
  .lsn .end .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .lsn .end .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .lsn.leave{opacity:.7}
  .lsn.leave .per{background:var(--low-soft);border-color:var(--low-line)}

  .chip{font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap;
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
  .chip.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
  .chip.todo{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .chip.bad{background:var(--full-soft);border-color:var(--full-line);color:var(--full)}
  .chip.leave{background:var(--low-soft);border-color:var(--low-line);color:var(--low)}
  .chip.wait{background:var(--surface-2);border-color:var(--line);color:var(--ink-3)}
  .chip.queued{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

  /* ---- taking a register before the app is up ---- */
  .lsn.tap{pointer-events:auto;cursor:pointer;text-align:left;
    transition:border-color .12s ease,background .12s ease,transform .08s ease}
  .lsn.tap:hover{border-color:var(--line-2);background:var(--surface-2)}
  .lsn.tap:active{transform:scale(.99)}
  .qbar{display:flex;align-items:center;gap:12px;padding:2px 0 12px}
  .qbar b{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
  .qback{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    width:36px;height:36px;flex:none;cursor:pointer;font-size:17px;line-height:1;color:var(--ink);
    box-shadow:var(--shadow)}
  .qsub{font-size:12.5px;color:var(--ink-2);padding:0 0 12px}
  /* The same tile grid the app uses, and the same P -> A -> L cycle on tap, so the
     register a teacher takes here is the one they already know rather than a second
     way of doing it that happens to live in the shell. The initials circle is hidden
     rather than removed for the same reason it is in the app: the tap handler writes
     the absent glyph into it. */
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px}
  .qtile{position:relative;display:flex;flex-direction:column;justify-content:center;
    text-align:left;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-md);padding:8px 10px 8px 14px;overflow:hidden;box-shadow:var(--shadow);
    cursor:pointer;font-family:inherit;color:var(--ink);
    transition:background .12s ease,border-color .12s ease,transform .08s ease}
  .qtile:active{transform:scale(.98)}
  .qtile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
  .qtile .av{display:none}
  .qtile .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:13.5px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
  .qtile .st{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    font-weight:700;color:var(--ink-3);margin-top:2px}
  .qtile[data-s="L"]{background:var(--low-soft);border-color:var(--low-line)}
  .qtile[data-s="L"]::before{background:var(--low)}
  .qtile[data-s="L"] .st{color:var(--low)}
  .qtile[data-s="A"]{background:var(--full-soft);border-color:var(--full-line)}
  .qtile[data-s="A"]::before{background:var(--full)}
  .qtile[data-s="A"] .st{color:var(--full)}
  .qlegend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink-2);margin-bottom:9px}
  .qlegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

  /* ---- a student's cached summary ---- */
  .stot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:18px;text-align:center;margin-bottom:9px;box-shadow:var(--shadow)}
  .stot b{display:block;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums}
  .stot span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:6px}
  .srow{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:8px;box-shadow:var(--shadow)}
  .srow.past{opacity:.55}
  .slab{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .sfig{font-size:12.5px;color:var(--ink-3);flex:none}
  .spct{font-weight:700;font-size:16px;flex:none;min-width:52px;text-align:right;
    font-variant-numeric:tabular-nums}

  .qacts{display:flex;gap:9px;margin:14px 0 4px;position:sticky;bottom:0;
    padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}
  .qbtn{flex:1;padding:14px;border:1px solid var(--accent);border-radius:var(--r-md);
    background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;cursor:pointer;
    font-family:inherit;box-shadow:var(--shadow);
    transition:background .12s ease,transform .08s ease}
  .qbtn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .qbtn:active{transform:scale(.985)}
  .qbtn.alt{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
  .qbtn.alt:hover{background:var(--surface-2)}
  .qnote{font-size:12px;color:var(--ink-2);text-align:center;padding:8px 0 0}

  /* ---- first-ever open: ask for the code ---- */
  .ask{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:24px}
  .box{width:100%;max-width:320px;text-align:center}
  .box h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;color:var(--ink)}
  .box p{font-size:13.5px;color:var(--ink-2);margin:0 0 18px;line-height:1.5}
  .box input{width:100%;-webkit-appearance:none;appearance:none;padding:13px;
    border:1px solid var(--line);border-radius:var(--r-md);font-size:16px;font-family:inherit;
    text-align:center;letter-spacing:.05em;background:var(--surface);color:var(--ink)}
  .box input:focus{border-color:var(--line-2);outline:2px solid var(--accent);outline-offset:2px}
  .box button{width:100%;margin-top:10px;padding:14px;border:1px solid var(--accent);
    border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-size:15px;
    font-weight:600;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .box button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<!--
  SETUP: paste your web app /exec URL into WEBAPP_URL below. Nothing else to change.

  Send each teacher:  https://YOURNAME.github.io/attendance/?t=THEIR_TOKEN
  On first open the code is saved on their device and wiped from the address bar, so
  the link stops being visible in history, screenshots or over-the-shoulder glances.
  This file itself contains no teacher codes — it is safe to host publicly.

  After the first successful load the app posts a copy of the day back to this page,
  which stores it per token. Later opens paint those cards immediately, so the teacher
  is looking at their real timetable while Apps Script is still starting up. The
  snapshot holds no student names and no marks — only the lesson grid.
-->
<div class="ask" id="ask" style="display:none">
  <div class="box">
    <h1>Attendance</h1>
    <p>Enter the code from your attendance link.</p>
    <input id="code" type="text" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="your code">
    <button id="go">Open my register</button>
  </div>
</div>

<div class="ph" id="shell" aria-hidden="true">
  <div class="inner">
    <div class="sbar"><span class="slogo">Attendance</span><span class="spill"></span><span class="sdot"></span></div>
    <div class="sblock hday" style="width:70%;margin:0 auto 14px"></div>
    <div class="sblock hlsn"></div>
    <div class="sblock hlsn"></div>
    <div class="sblock hlsn"></div>
  </div>
</div>

<div class="ph" id="instant" aria-hidden="true" style="display:none"><div class="inner" id="instantInner"></div></div>
<div class="ph" id="quick" style="display:none"><div class="inner" id="quickInner"></div></div>
<div id="slot"></div>

<script>
(function () {
  'use strict';

  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxtkE0-FzD5YCp5yweSo4pP2EEtZdVfEl7mW_VTa7hnEkCx41gqpfLj6IonJtCksQHh/exec';
  var KEY   = 'attendance-code';
  var SNAP  = 'attendance-snap:';     // one entry per token, so a shared device cannot mix people up
  var QUEUE = 'attendance-queue:';    // registers marked before the app was up
  var STU   = 'attendance-stu:';      // a student's own figures, for their next open
  var KEEP_DAYS = 10;

  /* How stale a class list may be and still be typed into. The timetable repeats
     weekly, so last Tuesday's list is almost always this Tuesday's — but a student
     who joined or left three weeks ago should not still be on it. The server has the
     last word regardless: apiSave rebuilds the marks from the current roster. */
  var ROSTER_DAYS = 14;

  function $(id){ return document.getElementById(id); }
  function p2(n){ return (n < 10 ? '0' : '') + n; }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function stored(){ try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function keep(t){ try { localStorage.setItem(KEY, t); } catch (e) {} }

  /* ---- the device-side snapshot ------------------------------------------ */

  function readSnap(token){
    try {
      var raw = localStorage.getItem(SNAP + token);
      if (!raw) return null;
      var s = JSON.parse(raw);
      return (s && s.v === 1) ? s : null;
    } catch (e) { return null; }
  }
  function writeSnap(token, s){
    try { localStorage.setItem(SNAP + token, JSON.stringify(s)); } catch (e) {}
  }

  /* Store today's day under its date, and also keep the lesson grid under its
     weekday. The timetable repeats weekly, so last Monday's grid is a correct
     preview of this Monday's — the marks are not, which is why only the
     structure is reused and every chip is reset. */
  function absorbSnap(token, msg){
    var s = readSnap(token) || { v:1, days:{}, dow:{} };
    s.meta = { school: msg.school, teacher: msg.teacher };
    s.days = s.days || {}; s.dow = s.dow || {}; s.dowAt = s.dowAt || {};
    if (msg.day && msg.day.date) {
      msg.day.savedAt = Date.now();
      s.days[msg.day.date] = msg.day;
      /* Key the weekday grid by the same three-letter weekday paintCached reads.
         dayShort is a DISPLAY string from the server — "Friday 28 Aug" — so keying
         on it wrote the grid under one name and read it under another, and the two
         never met. That silently disabled the fallback that matters most: the first
         open of each morning, when there is no snapshot for today yet. Deriving the
         key from the day's own date cannot drift from the label's format. */
      var dow = SHORT[asDate(msg.day.date).getDay()];
      if (dow) {
        s.dow[dow] = msg.day.lessons || [];
        s.dowAt[dow] = Date.now();                    // how old this class list is
      }
      // Drop anything written under the old display-string key.
      Object.keys(s.dow).forEach(function (k) {
        if (SHORT.indexOf(k) === -1) { delete s.dow[k]; delete s.dowAt[k]; }
      });
      var keys = Object.keys(s.days).sort();
      while (keys.length > KEEP_DAYS) delete s.days[keys.shift()];
    }
    writeSnap(token, s);
  }

  /* ---- a student's own figures ------------------------------------------- */

  /**
   * Students had no cached screen at all: every open waited out the whole cold start,
   * every single time, because the only snapshot the app ever posted was a teacher's
   * register grid. This is the same idea pointed at the other role — their own totals,
   * on their own device, replaced by the live figures moments later.
   */
  /* Normally the live figures land a second later and nobody reads this line. But if
     the app never loads at all, this is the only screen that can sit there showing old
     numbers, and "updating" alone would not admit how old. Anything not from today
     names its day; a calendar day, not 24 hours, because "last seen on 12 Sep" is what
     a person means when they ask when they last looked. */
  function seenNote(s){
    var at = Number(s.at || 0);
    if (at) {
      var d = new Date(at), now = new Date();
      if (d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth()
          || d.getDate() !== now.getDate())
        return 'Last seen on ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' &middot; updating';
    }
    // No stamp means it was stored before this page learned to date them: one open.
    return 'Your last view &middot; updating';
  }

  function paintStudent(token){
    var s;
    try { s = JSON.parse(localStorage.getItem(STU + token) || 'null'); } catch (e) { return false; }
    if (!s || !s.totals) return false;

    var t = s.totals;
    var pct = function (v) { return Math.round((v || 0) * 100) + '%'; };
    var row = function (label, x, muted) {
      return '<div class="srow' + (muted ? ' past' : '') + '">' +
        '<span class="slab">' + esc(label) + '</span>' +
        '<span class="sfig">' + (x.total || 0) + ' lessons</span>' +
        '<span class="spct">' + pct(x.rate) + '</span></div>';
    };

    $('instantInner').innerHTML =
      '<div class="sbar"><span class="slogo">' + esc(s.school || 'Attendance') + '</span>' +
      '<span class="name"><span class="avatar">' + esc(initials(s.name)) + '</span></span></div>' +
      '<div class="dhead"><b>' + esc(s.name || '') + '</b><span>' +
        esc(['Year ' + (s.year || ''), s.option, s.rangeLabel].filter(Boolean).join(' · ')) +
      '</span></div>' +
      '<div class="note"><span class="spin"></span>' + seenNote(s) + '</div>' +
      '<div class="stot"><b>' + pct(t.rate) + '</b><span>' + (t.present || 0) + ' present · ' +
        (t.late || 0) + ' late · ' + (t.absent || 0) + ' absent</span></div>' +
      (s.subjects || []).map(function (x) { return row(x.label, x, x.dropped); }).join('');

    $('instant').style.display = 'block';
    $('shell').classList.add('gone');
    return true;
  }

  /* ---- registers marked before the app finished loading ------------------- */

  function readQueue(token){
    try { return JSON.parse(localStorage.getItem(QUEUE + token) || '[]') || []; }
    catch (e) { return []; }
  }
  function writeQueue(token, q){
    try { localStorage.setItem(QUEUE + token, JSON.stringify(q)); } catch (e) {}
  }
  function sameLesson(a, b){
    return a.classId === b.classId && a.date === b.date && String(a.period) === String(b.period);
  }
  /* One entry per lesson: marking it twice before it syncs replaces, never duplicates. */
  function queueAdd(token, item){
    var q = readQueue(token).filter(function (x) { return !sameLesson(x, item); });
    q.push(item);
    writeQueue(token, q);
  }
  function queueDrop(token, m){
    writeQueue(token, readQueue(token).filter(function (x) { return !sameLesson(x, m); }));
  }
  function queuedFor(token, l, iso){
    var q = readQueue(token);
    for (var i = 0; i < q.length; i++) {
      if (sameLesson(q[i], { classId: l.classId, date: iso, period: l.period })) return q[i];
    }
    return null;
  }

  /* ---- rendering the cached view ----------------------------------------- */

  var DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var SHORT  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function todayIso(){ var d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
  // midday avoids any daylight-saving edge shifting the day by one
  function asDate(iso){ return new Date(iso + 'T12:00:00'); }
  function initials(n){
    return String(n||'').trim().split(/\s+/).slice(0,2)
      .map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
  }

  function chip(l, live, queued){
    if (queued)  return '<span class="chip queued">Saved &middot; syncing</span>';
    if (!live)   return '<span class="chip wait">&hellip;</span>';
    if (l.taken) return '<span class="chip ok">Taken</span>';
    if (l.leave) return '<span class="chip leave">' + esc(l.leave) + '</span>';
    return '<span class="chip todo">To do</span>';
  }
  /* Tappable only when we hold a class list for it that is recent enough to type
     into, and the lesson is not someone else's cover. */
  function markable(l, fresh){
    return !!(fresh && l.students && l.students.length && !l.leave);
  }
  function card(l, admin, live, i, fresh, queued){
    var sub = [ (l.start ? l.start + '-' + l.end : ''), l.room, (admin ? l.teacher : '') ]
      .filter(Boolean).join(' \u00b7 ');
    var count = queued ? 'register ready'
              : (live && l.taken) ? (l.flagged + '/' + l.total + ' flagged')
                                  : (l.total + ' students');
    var tap = markable(l, fresh);
    return '<' + (tap ? 'button type="button"' : 'div') +
      ' class="lsn' + (l.leave && !l.taken ? ' leave' : '') + (tap ? ' tap' : '') + '"' +
      (tap ? ' data-i="' + i + '"' : '') + '>' +
      '<div class="per"><b>' + esc(l.period) + '</b><span>Per</span></div>' +
      '<div class="mid"><div class="t">' + esc(l.label) + '</div>' +
      '<div class="s">' + esc(sub) + '</div></div>' +
      '<div class="end">' + chip(l, live, queued) + '<span class="n">' + esc(count) + '</span></div>' +
      '</' + (tap ? 'button' : 'div') + '>';
  }

  /**
   * Paint whatever the device already knows. Returns true if anything was drawn.
   * Three levels, in order of preference:
   *   1. today's own snapshot     -> real cards, real chips
   *   2. the same weekday's grid  -> real cards, chips reset to "…"
   *   3. name and date only       -> skeleton cards underneath
   * It never guesses attendance: a chip only appears when it came from today.
   */
  function paintCached(token){
    var s = readSnap(token);
    if (!s || !s.meta) return false;

    var iso = todayIso(), d = asDate(iso);
    var day = s.days && s.days[iso];
    var live = !!day;
    var at = day ? day.savedAt : 0;
    var key = SHORT[d.getDay()];
    var proto = (s.dow && s.dow[key]) || [];
    if (!day) {
      if (proto.length) { day = { lessons: proto }; at = (s.dowAt && s.dowAt[key]) || 0; }
    } else if (day.lessons && day.lessons.length && proto.length) {
      /* Today's snapshot wins on WHICH lessons there are and on the chips, but it may
         carry no class lists — it was written by an older build, or before the offline
         register was switched on. The weekday grid may hold the names for those same
         lessons. Graft them across rather than making the teacher wait out a cold start
         for a roster the device already has. This is what a deploy looks like from the
         inside: real cards that were mysteriously not tappable until the app had run
         once more. */
      var borrowed = false;
      day.lessons.forEach(function (l) {
        if (l.students && l.students.length) return;
        for (var i = 0; i < proto.length; i++) {
          var p = proto[i];
          if (p.classId === l.classId && String(p.period) === String(l.period) &&
              p.students && p.students.length) { l.students = p.students; borrowed = true; return; }
        }
      });
      // Borrowed names are only as fresh as the grid they came from.
      if (borrowed) at = Math.min(at || 0, (s.dowAt && s.dowAt[key]) || 0);
    }
    // Old enough that someone may have joined or left the class since.
    var fresh = !!at && (Date.now() - at) < ROSTER_DAYS * 864e5;

    var admin = !!(s.meta.teacher && s.meta.teacher.admin);
    var name  = (s.meta.teacher && s.meta.teacher.name) || '';
    var lessons = (day && day.lessons) || [];
    var anyTap = lessons.some(function (l) { return markable(l, fresh); });

    QS.token = token;
    QS.lessons = lessons;
    QS.admin = admin;
    QS.live = live;
    QS.fresh = fresh;
    QS.iso = iso;

    var html =
      '<div class="sbar"><span class="slogo">' + esc(s.meta.school || 'Attendance') + '</span>' +
      '<span class="name"><span class="nm">' + esc(name) + '</span>' +
      '<span class="avatar">' + esc(initials(name)) + '</span></span></div>' +
      '<div class="dhead"><b>' + esc(DAYS[d.getDay()]) + '</b><span>' +
        esc(d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear()) + '</span></div>' +
      '<div class="note"><span class="spin"></span>' +
        (anyTap ? 'Ready. Tap a lesson to take the register'
                : live ? 'Your last view \u00b7 updating' : 'Your usual timetable \u00b7 checking today') +
      '</div>';

    if (lessons.length) {
      html += '<div class="lessons">' +
        lessons.map(function (l, i) {
          return card(l, admin, live, i, fresh, !!queuedFor(token, l, iso));
        }).join('') +
        '</div>';
    } else {
      html += '<div class="sblock hlsn"></div><div class="sblock hlsn"></div><div class="sblock hlsn"></div>';
    }

    $('instantInner').innerHTML = html;
    $('instant').style.display = 'block';
    $('shell').classList.add('gone');
    return true;
  }

  /* ---- the register the teacher can take while Apps Script is still starting ---- */

  var QS = { token:'', lessons:[], admin:false, live:false, fresh:false, iso:'',
             lesson:null, marks:{}, editing:false, ready:false, frame:null, onDone:null };

  function repaintCards(){
    if (!QS.lessons.length) return;
    var host = $('instantInner').querySelector('.lessons');
    if (!host) return;
    host.innerHTML = QS.lessons.map(function (l, i) {
      return card(l, QS.admin, QS.live, i, QS.fresh, !!queuedFor(QS.token, l, QS.iso));
    }).join('');
  }

  function openQuick(i){
    var l = QS.lessons[i];
    if (!l || !markable(l, QS.fresh)) return;
    QS.lesson = l;
    QS.marks = {};
    var prev = queuedFor(QS.token, l, QS.iso);
    l.students.forEach(function (st) {
      QS.marks[st.id] = (prev && prev.statuses && prev.statuses[st.id]) || 'P';
    });
    QS.editing = true;
    $('quick').style.display = 'block';
    $('instant').style.display = 'none';
    renderQuick();
  }
  function closeQuick(){
    QS.editing = false;
    QS.lesson = null;
    $('quick').style.display = 'none';
    $('instant').style.display = 'block';
    repaintCards();
    // The app may have finished loading while they were marking; only now is it
    // safe to swap the screen out from under them.
    if (QS.ready && QS.onDone) QS.onDone();
  }

  /* The app's own cycle and wording, so a teacher is not learning a second register. */
  var CYCLE = { P: 'A', A: 'L', L: 'P' };
  var WORD  = { P: 'Present', A: 'Absent', L: 'Late' };

  function tile(st){
    var v = QS.marks[st.id] || 'P';
    return '<button type="button" class="qtile" data-id="' + esc(st.id) + '" data-s="' + v + '"' +
      ' aria-label="' + esc(st.name) + ', ' + WORD[v] + '">' +
      '<span class="av">' + (v === 'A' ? '&#10005;' : esc(initials(st.name))) + '</span>' +
      '<span class="nm">' + esc(st.name) + '</span>' +
      '<span class="st">' + WORD[v] + '</span></button>';
  }

  function renderQuick(){
    var l = QS.lesson;
    var sub = [ (l.start ? l.start + '-' + l.end : ''), l.room ].filter(Boolean).join(' \u00b7 ');

    $('quickInner').innerHTML =
      '<div class="qbar"><button type="button" class="qback" id="qb" aria-label="Back to lessons">&#8249;</button>' +
      '<b>' + esc(l.label) + '</b></div>' +
      '<div class="qsub">Period ' + esc(l.period) + (sub ? ' \u00b7 ' + esc(sub) : '') +
        ' \u00b7 ' + l.students.length + ' students \u00b7 tap to change</div>' +
      '<div class="qlegend"><span><i style="background:var(--late)"></i>Late</span>' +
        '<span><i style="background:var(--absent)"></i>Absent</span></div>' +
      '<div class="qgrid" id="qgrid">' + l.students.map(tile).join('') + '</div>' +
      '<div class="qacts">' +
        '<button type="button" class="qbtn alt" id="qall">All present</button>' +
        '<button type="button" class="qbtn" id="qsave">Save register</button>' +
      '</div>' +
      '<div class="qnote">Saves as soon as the app finishes loading.</div>';

    $('qb').addEventListener('click', closeQuick);
    $('qall').addEventListener('click', function () {
      l.students.forEach(function (st) { QS.marks[st.id] = 'P'; });
      renderQuick();
    });
    $('qsave').addEventListener('click', saveQuick);

    // One listener on the grid: tapping a tile advances it P -> A -> L -> P.
    $('qgrid').addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('.qtile') : null;
      if (!el) return;
      var id = el.getAttribute('data-id');
      var next = CYCLE[QS.marks[id] || 'P'];
      QS.marks[id] = next;
      el.setAttribute('data-s', next);
      var who = l.students.filter(function (s) { return s.id === id; })[0] || { name: '' };
      el.querySelector('.av').innerHTML = next === 'A' ? '&#10005;' : esc(initials(who.name));
      el.querySelector('.st').textContent = WORD[next];
      el.setAttribute('aria-label', who.name + ', ' + WORD[next]);
    });
    $('quick').scrollTop = 0;
  }

  function saveQuick(){
    var l = QS.lesson, statuses = {};
    l.students.forEach(function (st) { statuses[st.id] = QS.marks[st.id] || 'P'; });
    queueAdd(QS.token, { classId: l.classId, date: QS.iso, period: l.period,
                         statuses: statuses, label: l.label, at: Date.now() });
    closeQuick();
    flushQueue();
  }

  /* google.script.run only exists inside the app's frame, so queued registers are
     handed to it to write. Entries stay put until the app confirms each one.

     The target is the window that talked to US (captured from the inbound message),
     never our own iframe's contentWindow — that iframe is Google's shim page, and
     the app runs in a sandbox frame one level below it. Posting to the shim drops
     the message silently. */
  function flushQueue(){
    var target = QS.app || (QS.frame && QS.frame.contentWindow);
    if (!QS.ready || !target) return;
    var q = readQueue(QS.token);
    if (!q.length) return;
    try { target.postMessage({ type:'attendance:save', v:1, items:q }, '*'); } catch (e) {}
  }

  /* ---- opening the app ---------------------------------------------------- */

  /* Anything else in the address (view=students, s=P014) rides along to the app. */
  function passthrough(){
    var extra = '';
    location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return;
      var k = kv.split('=')[0];
      if (k === 't') return;                       // the code is handled separately
      extra += '&' + kv;
    });
    return extra;
  }

  /* ---- timing readout, shown only with ?debug=1 --------------------------
     Measures the real thing on the real device, rather than a stand-in on a
     laptop. Also prints which deployment is being called, which is the usual
     culprit when the app is slower in use than in a test. */
  var DEBUG = /[?&]debug=1/.test(location.search);
  var T0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var marks = [];
  function mark(label){
    if (!DEBUG) return;
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    marks.push([label, Math.round(now - T0)]);
    var el = $('dbg');
    if (!el) {
      el = document.createElement('div');
      el.id = 'dbg';
      el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9;' +
        'background:rgba(11,16,32,.90);color:#fff;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;' +
        'padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-height:44vh;overflow:auto';
      document.body.appendChild(el);
    }
    var dep = (WEBAPP_URL.match(/\/macros\/s\/([^/]+)/) || ['',''])[1];
    el.textContent = 'deployment ' + dep.substring(0, 16) + '…\n' +
      marks.map(function (m) { return m[1] + ' ms  ' + m[0]; }).join('\n');
  }

  function open(t, extra){
    $('ask').style.display = 'none';
    mark('script start');

    // Only preview the register when the link is asking for the register. A link
    // carrying view=students or s=P014 wants a different screen entirely.
    if (!extra) {
      try {
        // Teacher first, then the student summary: whichever this device has.
        mark(paintCached(t) ? 'cached cards painted'
           : paintStudent(t) ? 'cached student figures painted'
           : 'no cache — skeleton');
      } catch (e) {}
    }

    var shown = false;
    var f = null;
    function reveal(){
      if (shown) return;
      // Never swap the app in over a half-marked register. closeQuick calls back.
      if (QS.editing) { QS.onDone = reveal; return; }
      shown = true;
      if (f) f.classList.add('ready');
      setTimeout(function () {
        $('shell').classList.add('gone');
        $('instant').classList.add('gone');
      }, 180);
    }

    // Tapping a cached lesson opens the register, before the app is anywhere near up.
    $('instant').addEventListener('click', function (e) {
      var c = e.target.closest ? e.target.closest('.lsn.tap') : null;
      if (!c) return;
      openQuick(Number(c.getAttribute('data-i')));
    });

    // Store every snapshot the app sends, for this open and all the ones after.
    window.addEventListener('message', function (e) {
      var m = e && e.data;
      // Remember which window the app actually speaks from; it is not our iframe.
      if (e.source && e.source !== window &&
          (m === 'attendance:ready' || (m && m.v === 1))) QS.app = e.source;
      if (m === 'attendance:ready') {
        mark('app painted (attendance:ready)');
        QS.ready = true;
        flushQueue();                       // anything marked while it was loading
        reveal();
        return;
      }
      if (!m || m.v !== 1) return;
      if (m.type === 'attendance:snapshot') {
        try { absorbSnap(t, m); } catch (err) {}
        return;
      }
      if (m.type === 'attendance:student') {
        // Stamped on arrival so a summary that is never refreshed can say how old it
        // is. The device that writes it is the device that reads it, so only its own
        // clock has to agree with itself.
        try { m.at = Date.now(); localStorage.setItem(STU + t, JSON.stringify(m)); } catch (err) {}
        return;
      }
      if (m.type === 'attendance:theme') {
        // The app owns the toggle; this page owns the preference, because it paints
        // first on the next open and has the origin that survives a redeploy.
        if (m.theme === 'dark' || m.theme === 'light') {
          try { localStorage.setItem('attendance-theme', m.theme); } catch (err) {}
          document.documentElement.setAttribute('data-theme', m.theme);
        }
        return;
      }
      if (m.type === 'attendance:saved') {
        // Only drop it once the server has confirmed; a failure keeps it queued so
        // the next open tries again rather than losing the register.
        if (m.ok) { queueDrop(t, m); mark('queued register saved'); }
        else { mark('queued register failed: ' + (m.error || '')); }
        if (!QS.editing) repaintCards();
      }
    });

    // Built fresh with its src already set, so the only load event is the app's own —
    // an iframe that starts empty fires one for about:blank and hides the shell too early.
    f = document.createElement('iframe');
    f.id = 'app';
    f.title = 'Attendance';
    f.setAttribute('allow', 'clipboard-write');

    // Hard stop, in case an older build is deployed that doesn't post the message.
    // This used to be the normal path rather than the exception: the app was posting
    // to the wrong window, so nothing ever arrived and every open sat here for the
    // full 12 seconds while the app itself had been ready for nine of them.
    setTimeout(reveal, 12000);
    f.onload = function () {
      mark('iframe document loaded');
      // Second line of defence. Only fires if attendance:ready never lands; when it
      // does, reveal has already run and this is a no-op.
      setTimeout(reveal, 3500);
    };
    /* Hand the app the theme on its URL. It runs in a sandbox frame with no query
       string of its own, so this is the only way it can know before its first paint;
       anything later shows as a flash of the wrong theme. */
    var themed = '';
    try {
      var pref = localStorage.getItem('attendance-theme');
      if (pref === 'dark' || pref === 'light') themed = '&theme=' + pref;
    } catch (e) {}
    f.src = WEBAPP_URL + '?t=' + encodeURIComponent(t) + (extra || '') + themed;
    QS.frame = f;
    $('slot').appendChild(f);
    mark('iframe requested');

    // never leave a placeholder up forever if something goes wrong
    setTimeout(function () {
      if (QS.editing) return;                 // unless they are mid-register
      f.classList.add('ready');
      $('shell').classList.add('gone');
      $('instant').classList.add('gone');
    }, 15000);
  }

  var extra = passthrough();
  var fromLink = (location.search.match(/[?&]t=([^&]+)/) || [])[1] || '';
  if (fromLink) {
    fromLink = decodeURIComponent(fromLink);
    keep(fromLink);
    // drop the code from the address bar, but keep any view the link asked for
    history.replaceState(null, '', location.pathname + (extra ? '?' + extra.substring(1) : ''));
    open(fromLink, extra);
  } else if (stored()) {
    open(stored(), extra);
  } else {
    $('shell').classList.add('gone');
    $('ask').style.display = 'grid';
    $('go').addEventListener('click', function () {
      var v = $('code').value.trim();
      if (!v) return;
      keep(v); open(v, extra);
    });
    $('code').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('go').click();
    });
  }
})();
</script>
</body>
</html>
