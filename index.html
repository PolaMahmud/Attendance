<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* KS5 attendance — backend switch (step 2 of db-migration/PLAN.md, "Rollout").
 *
 * Paste this, inside <script>…<\/script>, as the FIRST thing in <head> of index.html (the Apps Script
 * app, side "old"), and of the new app's page at ./v2/ (side "new") with SIDE changed to 'new'.
 * Inline, not <script src>: a separate file would add a network round trip before the first paint.
 *
 * Who goes where is decided by backend.json next to index.html:
 *   { "newUrl": "",  "default": "old", "testers": [] }
 *   newUrl   the new app's address, relative to index.html (e.g. "v2/"). Blank = everyone stays on
 *            Apps Script whatever else is set, which is how it ships.
 *   default  "old" or "new": where everyone not listed goes.
 *   testers  first 12 hex characters of SHA-256(token) for people who go to the new app early.
 *            Hashes, not tokens: backend.json is public and a token is a login.
 *            Make one with:  printf %s 'THEIR_TOKEN' | sha256sum | cut -c1-12
 *
 * A link can override it for that device:  ?backend=new  ?backend=old  ?backend=auto (clear).
 *
 * The decision is made from what this device stored last time, so the page never waits on the
 * network. backend.json is then fetched in the background and the stored decision updated; it
 * takes effect on the next open. Both sides run this, so a flip back to "old" is honoured even by
 * someone who is sitting in the new app: it sends them back on their next open.
 */
(function () {
  'use strict';
  var SIDE = 'old';                              // 'new' on the new app's page
  var HOME = SIDE === 'old' ? './' : '../';      // where index.html and backend.json live, from this page
  var LS = 'attendance-backend', OVR = 'attendance-backend-override', CODE = 'attendance-code';

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

  /* Pure: which side a person belongs on. Exported for the tests. */
  function decide(cfg, tokenHash, override) {
    if (!cfg || !cfg.newUrl) return 'old';                              // nothing to switch to
    if (override === 'new' || override === 'old') return override;
    if (tokenHash && (cfg.testers || []).indexOf(tokenHash) !== -1) return 'new';
    return cfg['default'] === 'new' ? 'new' : 'old';
  }

  function hash12(s) {
    if (!s || !window.crypto || !crypto.subtle || !window.TextEncoder) return Promise.resolve('');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('').slice(0, 12);
    }, function () { return ''; });
  }

  if (typeof module !== 'undefined' && module.exports) { module.exports = { decide: decide }; return; }

  var q = new URLSearchParams(location.search), o = q.get('backend');
  if (o === 'new' || o === 'old') set(OVR, o);
  if (o === 'auto') set(OVR, null);
  if (o) {                                       // tidy the address bar; keep ?t= for the app to pick up
    q['delete']('backend');
    var rest = q.toString();
    try { history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash); } catch (e) {}
  }

  function go(side, cfg) {
    if (side === SIDE) return false;
    var url = side === 'new' ? HOME + cfg.newUrl : HOME;
    location.replace(url + location.search + location.hash);
    return true;
  }

  // Decide now, from what this device knew last time.
  var known = null;
  try { known = JSON.parse(get(LS) || 'null'); } catch (e) {}
  if (known && known.cfg) {
    var side = o === 'new' || o === 'old' ? decide(known.cfg, known.h, o) : decide(known.cfg, known.h, get(OVR));
    if (go(side, known.cfg)) return;
  }

  // Refresh in the background for next time. Never redirects mid-session, except for an explicit ?backend=.
  var token = get(CODE) || q.get('t') || '';
  fetch(HOME + 'backend.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (cfg) {
      if (!cfg) return;
      return hash12(token).then(function (h) {
        set(LS, JSON.stringify({ cfg: cfg, h: h, at: Date.now() }));
        if (o === 'new' || o === 'old') go(decide(cfg, h, o), cfg);
      });
    })['catch'](function () {});
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>KS5 Hub</title>

<script>
/* Settle the theme before anything paints, RESOLVING the system preference to an
   explicit stamp so the stylesheet describes dark once rather than once per source.
   data-theme is always set; data-theme-by says whether the person or the OS decided. */
(function(){
  var t = '';
  try { t = localStorage.getItem('attendance-theme') || ''; } catch (e) {}
  var chosen = (t === 'dark' || t === 'light') ? t : '';
  var dark = chosen ? chosen === 'dark'
    : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-by', chosen ? 'user' : 'system');

  /* Make the status bar follow the theme the PERSON picked, not the one the phone is in.

     The two theme-color tags above are matched on prefers-color-scheme, which is the OS
     setting. With the phone in light mode and the app set to dark, the light tag matched:
     Android painted a white band above a black app, and the clock and battery in it went
     white-on-white. Replacing both with one already-resolved value is the fix, because by
     here we know which theme actually won. setTheme keeps it honest after a toggle. */
  var old = document.querySelectorAll('meta[name="theme-color"]');
  for (var i = old.length - 1; i >= 0; i--) old[i].parentNode.removeChild(old[i]);
  var mt = document.createElement('meta');
  mt.setAttribute('name', 'theme-color');
  mt.setAttribute('content', dark ? '#000000' : '#F3F2F7');
  document.head.appendChild(mt);
})();
</script>
<script>
/* iOS Safari ignores user-scalable=no, and a laptop trackpad pinch arrives as
   ctrl+wheel; either would zoom the app like a web page. Ctrl +/- is left alone
   for anyone who needs larger text. */
(function(){
  function stop(e){ e.preventDefault(); }
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t, stop, {passive:false});
  });
  document.addEventListener('wheel', function(e){ if (e.ctrlKey) e.preventDefault(); }, {passive:false});
})();
</script>

<!-- Home-screen icon. All relative, because Pages may serve this from a project
     subpath (yourname.github.io/attendance/) rather than the domain root.

     iOS wants a PNG here; it ignores SVG for apple-touch-icon, which is what the
     placeholder used to be. It also applies its OWN rounded mask, so the file is
     full bleed: indigo right to the edges, no corners of its own, and no alpha at all
     because iOS composites transparency against black. make-icons.ps1 builds these
     from icon.png, the 1024px master.

     sizes is declared because WebKit sorts candidate touch icons by their DECLARED
     size and scores an undeclared one as 60px, so an unsized 180 can lose to a
     smaller rival that did declare itself. -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

<style>
  /* This page paints the first screen and the app fades in over it, so the two have
     to agree — on the theme, and on the metrics. They cannot share storage (different
     origins), so the app posts its choice here and this page passes it back on the
     iframe URL.

     Every token below is copied from App.html. When one moves, both move, or the
     cached cards jump the moment the live app arrives. */
  :root{
    /* The app's layer for its tab bar (App.html's z-index scale), so the copy below matches it rule for rule. */
    --z-tabs:28;
    --bg:#F3F2F7; --surface:#FFFFFF; --surface-2:#F6F5FA; --surface-3:#ECEBF2;
    --ink:#1F2330; --ink-2:#6B6F7B; --ink-3:#686C78;
    --line:#E7E6EE; --line-2:#D4D3DD;

    --accent:#1F2330; --accent-hover:#363A48; --accent-ink:#FFFFFF;
    --accent-soft:#ECEBF2; --accent-line:#D4D3DD;

    --low:#8A4B12;  --low-soft:#FBE6CF;  --low-line:#F0CFA8;
    --full:#9B2F35; --full-soft:#F7DADA; --full-line:#EDBDBD;
    --ok:#2E6A45;   --ok-soft:#DCEFE2;   --ok-line:#BBDCC6;
    --ring-p:#8DCCA3; --ring-l:#F2BC86; --ring-a:#E9A3A3;   /* the app's pastel graphic tones */

    --r-lg:22px; --r-md:14px; --r-sm:10px;
    --shadow:0 1px 2px rgba(31,35,48,.04),0 4px 14px rgba(31,35,48,.04);
    --sheen:rgba(31,35,48,.05);

    /* Liquid Glass, as App.html defines it. */
    --gl-bg:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.28));
    --gl-blur:blur(9px) saturate(190%) brightness(1.04);
    --gl-edge:rgba(255,255,255,.8);
    --gl-shadow:0 10px 30px rgba(31,35,48,.12),0 1px 3px rgba(31,35,48,.06),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.5);
    --gl-sm:0 4px 14px rgba(31,35,48,.08),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.5);
    --gl-bar:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10));
    --gl-bar-blur:blur(5px) saturate(220%) brightness(1.06);
    --gl-lens:rgba(255,255,255,.78);
    --gl-lens-shadow:inset 0 1px 0 #FFFFFF,0 2px 10px rgba(31,35,48,.10);
    --gl-p:linear-gradient(180deg,rgba(52,56,68,.9),rgba(26,28,36,.95));
    --gl-p-edge:rgba(255,255,255,.3);
    --gl-p-shadow:0 8px 22px rgba(20,22,30,.22),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.25);
    --gl-p-ink:#FFFFFF;

    /* The subject line-art behind sign-in and the notification screens: faint, so it
       never competes with the card. This page only. */
    --art-1:#00B2F0; --art-2:#9B5CFF; --art-3:#FF7A1A; --art-4:#12D466; --art-5:#FF2E8A;
    --art-o:.24;

    /* The shell's own JS writes var(--late) and var(--absent) into the legend
       swatches inline, so those two names have to survive. Declared literally in
       both themes rather than aliased to --low / --full: an alias resolves against
       whichever value wins on :root, which is correct but easy to break silently. */
    --late:#8A4B12; --absent:#9B2F35;

    /* Subject tones, by option-block slot — the six App.html knows, and not one more.
       Copied rather than derived: this page paints the timetable card on the first
       screen, and a tone missing here would land as a white cell that changes colour
       the moment the app arrives. */
    --tt-as1:#FAF0C8; --tt-as1-line:#E7D68C;
    --tt-as2:#FBE3C4; --tt-as2-line:#EDC489;
    --tt-as3:#FADAD4; --tt-as3-line:#EEB2A7;
    --tt-a21:#D6E4FA; --tt-a21-line:#A6C2EC;
    --tt-a22:#D5EEDC; --tt-a22-line:#A2D2B1;
    --tt-a23:#E3DBF8; --tt-a23-line:#BEAEEA;

    /* The segmented control (I11): iOS's tertiary fill for the track, translucent so it
       reads on the page and on a card alike; the chosen segment is a raised pill. */
    --seg-track:rgba(118,118,128,.12); --seg-on:#FFFFFF;
    --seg-shadow:drop-shadow(0 3px 4px rgba(0,0,0,.10)) drop-shadow(0 0 .5px rgba(0,0,0,.18));
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

    /* Type (I9): Apple's text styles, and only these. Every size on the page is one of
       them, picked as the nearest step to what it was. They are rem against a 17px root
       (Body), so on an iPhone the whole ramp follows Settings > Display > Larger Text:
       html takes the system's own body size below, and everything scales with it. */
    --fs-large:calc(34rem / 17);    /* Large Title */
    --fs-title1:calc(28rem / 17);   /* Title 1 */
    --fs-title2:calc(22rem / 17);   /* Title 2 */
    --fs-title3:calc(20rem / 17);   /* Title 3 */
    --fs-headline:1rem;             /* Headline: Body's size, set semibold */
    --fs-body:1rem;                 /* Body, 17 */
    --fs-callout:calc(16rem / 17);  /* Callout */
    --fs-subhead:calc(15rem / 17);  /* Subheadline */
    --fs-footnote:calc(13rem / 17); /* Footnote */
    --fs-caption1:calc(12rem / 17); /* Caption 1 */
    --fs-caption2:calc(11rem / 17); /* Caption 2, the smallest there is */
  }
  :root[data-theme="dark"]{
    /* iOS's grouped dark ramp (I15), as App.html has it: black page, raised grey cards. */
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
    --ink:#F2F2F7; --ink-2:#AEAEB2; --ink-3:#9C9CA1;
    --line:#38383A; --line-2:#48484A;

    --accent:#F2F2F7; --accent-hover:#FFFFFF; --accent-ink:#1C1C1E;
    --accent-soft:#3A3A3C; --accent-line:#48484A;
    --seg-track:rgba(118,118,128,.24); --seg-on:#636366;
    --seg-shadow:drop-shadow(0 3px 4px rgba(0,0,0,.35));

    --low:#F3C99A;  --low-soft:#3D2E1F;  --low-line:#5A4430;
    --full:#F0B1B1; --full-soft:#3E2527; --full-line:#5E393B;
    --ok:#A6DDB8;   --ok-soft:#23362B;   --ok-line:#355440;
    --ring-p:#7FC79A; --ring-l:#E9B47E; --ring-a:#E39595;

    --late:#F3C99A; --absent:#F0B1B1;

    --shadow:0 1px 2px rgba(0,0,0,.4);
    --sheen:rgba(255,255,255,.06);

    --gl-bg:linear-gradient(180deg,rgba(58,58,60,.62),rgba(36,36,38,.58));
    --gl-blur:blur(9px) saturate(170%);
    --gl-edge:rgba(255,255,255,.09);
    --gl-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 .5px 0 rgba(255,255,255,.22);
    --gl-sm:0 4px 14px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.22);
    --gl-bar:linear-gradient(180deg,rgba(28,28,30,.55),rgba(0,0,0,.42));
    --gl-bar-blur:blur(6px) saturate(170%);
    --gl-lens:rgba(255,255,255,.10);
    --gl-lens-shadow:inset 0 .5px 0 rgba(255,255,255,.18);
    --gl-p:linear-gradient(180deg,rgba(255,255,255,.95),rgba(228,230,236,.88));
    --gl-p-edge:rgba(255,255,255,.65);
    --gl-p-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.1);
    --gl-p-ink:#1C1C1E;

    --art-1:#45D9FF; --art-2:#B87CFF; --art-3:#FFA03D; --art-4:#55FF8E; --art-5:#FF52A8;
    --art-o:.26;

    --tt-as1:#332E17; --tt-as1-line:#4E4526;
    --tt-as2:#362919; --tt-as2-line:#523E23;
    --tt-as3:#39231E; --tt-as3-line:#56332C;
    --tt-a21:#1B2841; --tt-a21-line:#2A3D5E;
    --tt-a22:#1A3125; --tt-a22-line:#284936;
    --tt-a23:#282142; --tt-a23-line:#3B3161;
  }

  /* App.html has this in its shared block and this file never did, so anything with
     width:100% plus padding was rendering wider than its container: the lesson card
     (347 + 26 + 2 = 375 in a 347 track), the code input and the save buttons. */
  *{box-sizing:border-box}
  /* The root is Body (I9). 106.25% is 17px wherever the browser's default is 16. On an
     iPhone (-webkit-touch-callout is iOS-only) the root is the system's body font
     instead, which is what the Larger Text setting moves; macOS Safari also knows
     -apple-system-body but reports 13px there, hence the guard. */
  html{font-size:106.25%}
  @supports (font:-apple-system-body) and (-webkit-touch-callout:none){
    html{font:-apple-system-body}
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
    overscroll-behavior:none}
  /* No pinch or double-tap zoom, here or through the frame; see App.html. */
  html,body,*{touch-action:pan-x pan-y}
  /* Text is not selectable anywhere, as in a native app. Fields must stay selectable
     or iOS will not let anyone place the cursor, select or paste inside them. */
  *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  /* pointer-events is the load-bearing half of this rule, not opacity.
     The frame is fixed at inset:0 above the cached screen, so at opacity:0 it is
     invisible AND still swallows every tap — the cards underneath render correctly,
     read as tappable, and simply never receive a finger. It must not take input
     until it is the thing on screen. */
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2;opacity:0;
    pointer-events:none;transition:opacity .25s ease}
  iframe.ready{opacity:1;pointer-events:auto}
  /* The status bar's strip, while the kept copy is on screen: the page's colour over
     whatever scrolls up under it, as the app's own bar is once it has its chrome. Over the
     placeholder (same z-index, later in the page), under the app's frame. */
  body::after{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);
    background:var(--bg);z-index:1;pointer-events:none}

  /* ---- placeholder layer: either the skeleton or the cached cards ---- */
  .ph{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 24px);
    transition:opacity .25s ease}
  .ph.gone{opacity:0;pointer-events:none}
  /* Above the iframe (z-index 2) so it can be tapped, and anchored to the bottom so it
     never covers the app's header or a register tile. */
  .notif{position:fixed;z-index:5;left:12px;right:12px;
    bottom:calc(env(safe-area-inset-bottom) + 12px);
    /* ...and above the app's own bottom tabs when it has them; --tabs is their height,
       posted by the app (attendance:tabs). */
    bottom:max(calc(env(safe-area-inset-bottom) + 12px), calc(env(safe-area-inset-bottom) + var(--tabs, 0px) + 10px));
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--gl-bg);color:var(--ink);border:1px solid var(--gl-edge);
    border-radius:22px;padding:12px 14px;font-size:var(--fs-footnote);line-height:1.35;box-shadow:var(--gl-shadow);
    -webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur)}
  .notif[hidden]{display:none}
  .notif .nbell{display:flex;align-items:center;gap:8px;font-weight:600}
  .notif .nbell svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .notif .stk{display:flex;gap:10px;align-items:flex-start}
  .notif .stk svg{width:20px;height:20px;flex:none;color:var(--low);margin-top:1px}
  .notif .stk b{display:block;font-size:var(--fs-subhead)}
  .notif .stkwhy{display:block;color:var(--ink-2)}
  .notif span{flex:1 1 160px;min-width:0}
  .notif button{flex:0 0 auto;border:1px solid var(--gl-p-edge);border-radius:99px;padding:9px 16px;
    font:inherit;font-weight:600;cursor:pointer;background:var(--gl-p);color:var(--gl-p-ink);
    box-shadow:var(--gl-p-shadow);min-height:40px}
  .notif button.alt{background:var(--gl-bg);color:var(--ink);
    border:1px solid var(--gl-edge);box-shadow:var(--gl-sm);font-weight:500}
  .inner{max-width:880px;margin:0 auto}

  /* ---- the bottom tabs: a MIRROR of App.html's .tabs block (invariant 35) ----
     Copied rule for rule so the app's bar fades in exactly on top of this one. Tokens
     only, so both themes follow. Change one, change both — tabs.test.js compares them. */
  .tabs{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:var(--z-tabs);
    max-width:560px;margin:0 auto;padding:5px;border-radius:99px;background:var(--gl-bar);
    border:1px solid var(--gl-edge);box-shadow:var(--gl-shadow);
    -webkit-backdrop-filter:var(--gl-bar-blur);backdrop-filter:var(--gl-bar-blur)}
  .tabs-in{display:flex;gap:2px}
  .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:6px 4px 7px;border-radius:99px;font-size:min(var(--fs-caption2),13px);font-weight:500;color:var(--ink-2);
    white-space:nowrap;transition:background .12s ease,box-shadow .12s ease}
  .tab .ic{display:grid;place-items:center;width:44px;height:26px;border-radius:99px}
  .tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--gl-lens);box-shadow:var(--gl-lens-shadow)}
  .tab[aria-current="page"] .ic{background:transparent}
  .tab .f,.tab[aria-current="page"] .o{display:none}
  .tab[aria-current="page"] .f{display:block}
  .tab .f{fill:currentColor;stroke:none}
  .tab .f .s{fill:none;stroke:currentColor}
  /* The app's tabs are <button>s, which do not inherit line-height: their labels sit at
     the font's `normal`, so the copy must too (1.5 made it 1px taller).
     And the copy TAKES taps. It used to be pointer-events:none, which did not make it
     inert — it let the tap fall through to the cached lesson card underneath, so reaching
     for Gradebook opened a register. A tap here is held and handed to the app when it is up. */
  .ph .tabs{line-height:normal}
  .ph .tab{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ph.hastabs{padding-bottom:calc(env(safe-area-inset-bottom) + 100px)}

  .sbar{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
  .slogo{font-weight:700;font-size:var(--fs-callout);letter-spacing:-.02em;color:var(--ink)}
  .spill{width:74px;height:26px;border-radius:99px;background:var(--surface-3)}
  .sdot{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--surface-3)}
  .sblock{border-radius:var(--r-lg);background:var(--surface-3);
    margin-bottom:9px;overflow:hidden;position:relative}
  .sblock::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,var(--sheen) 50%,transparent 80%);
    background-size:220% 100%;animation:sh 1.4s linear infinite}
  @keyframes sh{from{background-position:180% 0}to{background-position:-80% 0}}
  /* Measured off the live app: .lsn is 68px on a 9px grid, .datebar is 47px. If those
     change in App.html they change here, or the skeleton resizes under the teacher. */
  .hlsn{height:68px}.hday{height:47px}
  /* The week strip, which the app paints above everything else. This page cannot draw
     it — it holds today's lessons, not a timetable, and has no server clock to run a
     countdown against — so it holds the space open instead, and the card lands in it
     rather than shoving the day down the screen a moment after the teacher has started
     reading it. The height comes from the app, which measured its own card on the last
     open; this is only the fallback for the bare skeleton and for a snapshot written
     before the strip existed. */
  .htt{height:240px}

  /* ---- the timetable card, painted from the copy the app left behind ----
     Same class names and same sizes as App.html's own .tt block, so the real card
     lands on top of this one without a pixel moving. Static: no countdown, no taps
     and no time of day — this page has a device clock and no school one, and making
     up the difference is what invariant 31 forbids. These styles are a mirror, like
     .lsn above: change the timetable in App.html and change it here too. */
  .ttc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow)}
  .tt{padding:9px 11px 10px;margin-bottom:10px}
  .tthead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .ttlab{display:flex;align-items:center;gap:6px;flex:none;font-size:var(--fs-caption2);font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .ttlab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  /* App.html's one segmented control (I11): grey track drawn 4px in, 44px segments with
     the pill in the padding box, drawn by ::after with its own radius on a square segment,
     so its ends are round (a round segment's padding edge inside the 6px borders is an
     oval, and its background and overflow were cut to it, owner 25d). */
  .ttviews{position:relative;isolation:isolate;display:flex;gap:0;flex:1;padding:0 2px;margin:0;border-radius:99px}
  .ttviews::before{content:"";position:absolute;left:0;right:0;top:4px;bottom:4px;z-index:-1;border-radius:99px;
    background:var(--seg-track)}
  .ttview{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;flex:1 1 0;min-width:0;min-height:44px;padding:0 8px;
    border:solid transparent;border-width:6px 0;background:none;border-radius:0;
    font-size:var(--fs-footnote);font-weight:500;line-height:1.25;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttview::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:99px;pointer-events:none}
  .ttview.on{font-weight:600;filter:var(--seg-shadow)}
  .ttview.on::after{background-color:var(--seg-on)}
  .ttfold{width:26px;height:26px;flex:none;display:grid;place-items:center;color:var(--ink-3)}
  .ttfold svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}
  .ttfold.shut svg{transform:rotate(-90deg)}
  @media(max-width:359px){.ttlab .w{display:none}}

  /* The clock card carries the DATE only. The app fills in the time from the school's
     clock a second later, and .t:empty is what keeps a gap from showing until then. */
  .ttwhenwrap{display:flex;justify-content:flex-end;margin-bottom:10px}
  /* min-height, because the app fills in a second line (the time) that this page
     leaves empty — without it the card grows by 17px the moment the app lands. */
  .ttwhen{display:flex;align-items:center;gap:9px;padding:8px 12px;min-height:50px;
    font-variant-numeric:tabular-nums;line-height:1.2}
  .ttwhen svg{width:15px;height:15px;flex:none;color:var(--ink-3);fill:none;
    stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ttwhen .d{display:block;font-size:var(--fs-caption2);font-weight:600;color:var(--ink-3);white-space:nowrap}
  .ttwhen .t{display:block;font-size:var(--fs-callout);font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .ttwhen .t:empty{display:none}

  .ttweek{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;padding-bottom:2px;position:relative;scroll-padding-left:calc(var(--tt-gutter) + 6px)}
  /* Larger Text (owner, 24d): the cells hold two lines of their own text and the axis its
     times at any size; at the default both are what they were (32px, 52px). */
  :root{--tt-row:max(32px,calc(var(--fs-caption1) * 2.4 + 2px));--tt-gutter:max(52px,calc(var(--fs-caption2) * 3.6))}
  .ttgutter{position:sticky;left:0;z-index:2;flex:none;width:var(--tt-gutter);padding:6px 4px 6px 0;
    border:1px solid transparent;background:var(--surface)}
  .ttgutter .ttdn{visibility:hidden}
  .ttgrow{height:var(--tt-row);margin-bottom:3px;display:flex;flex-direction:column;
    justify-content:center;align-items:flex-end;text-align:right;
    font-variant-numeric:tabular-nums;line-height:1.15}
  .ttgrow:last-child{margin-bottom:0}
  .ttgrow b{font-size:var(--fs-caption2);font-weight:700;color:var(--ink-2)}
  .ttgrow span{font-size:var(--fs-caption2);font-weight:600;color:var(--ink-3)}
  .ttday{flex:1 0 96px;min-width:96px;padding:6px;border:1px solid var(--line);
    border-radius:var(--r-md);background:var(--surface-2)}
  .ttday.today{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}
  .ttdn{height:26px;display:flex;align-items:center;gap:5px;width:100%;text-align:left;
    padding:0 1px 4px}
  /* Weekday then ordinal date (S9), as App.html draws it. */
  .ttday{container-type:inline-size}
  .ttdn .dw,.ttchip .dw{font-size:var(--fs-caption1);font-weight:600;color:var(--ink-2);white-space:nowrap}
  .ttdn b,.ttchip b{font-size:var(--fs-footnote);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ttdn sup,.ttchip sup{font-size:.66em;line-height:0;vertical-align:.52em;margin-left:.5px;letter-spacing:0}
  .dw .wl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @container (min-width:112px){
    .ttdn .dw .wl{position:static;width:auto;height:auto;overflow:visible;clip:auto}
    .ttdn .dw .ws{display:none}
  }
  .ttday.today .ttdn b,.ttday.today .ttdn .dw{color:var(--accent)}
  .ttl,.ttgap{height:var(--tt-row);margin-bottom:3px;border-radius:var(--r-sm)}
  .ttl:last-child,.ttgap:last-child{margin-bottom:0}
  .ttl{display:flex;align-items:center;width:100%;text-align:left;padding:0 6px;
    background:var(--surface);border:1px solid var(--line)}
  .ttl .sj{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    -webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere;
    font-size:var(--fs-caption1);font-weight:600;line-height:1.2;letter-spacing:-.01em}
  .tt [data-tone="as1"]{background:var(--tt-as1);border-color:var(--tt-as1-line)}
  .tt [data-tone="as2"]{background:var(--tt-as2);border-color:var(--tt-as2-line)}
  .tt [data-tone="as3"]{background:var(--tt-as3);border-color:var(--tt-as3-line)}
  .tt [data-tone="a21"]{background:var(--tt-a21);border-color:var(--tt-a21-line)}
  .tt [data-tone="a22"]{background:var(--tt-a22);border-color:var(--tt-a22-line)}
  .tt [data-tone="a23"]{background:var(--tt-a23);border-color:var(--tt-a23-line)}
  .ttgap{box-shadow:inset 0 0 0 1px var(--line)}
  .ttempty{font-size:var(--fs-caption2);color:var(--ink-3);padding:3px 2px}
  .ttempty.tall{padding:16px 2px;text-align:center;font-size:var(--fs-footnote)}

  .ttchips{display:flex;gap:5px;overflow-x:auto;overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;padding-bottom:2px;margin-bottom:8px}
  .ttchip{flex:none;min-width:46px;display:flex;flex-direction:column;align-items:center;
    gap:1px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r-md);
    background:var(--surface-2);font-variant-numeric:tabular-nums}
  .ttchip .dw{font-size:var(--fs-caption2);line-height:1.2}
  .ttchip.today{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line)}
  .ttchip.today b,.ttchip.today .dw{color:var(--accent)}
  .ttchip.sel{background:var(--surface-3);border-color:var(--line-2)}
  .ttlist{display:flex;flex-direction:column;gap:3px}
  .ttp{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 10px;
    border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
  .ttp .pn{width:18px;flex:none;font-size:var(--fs-caption2);font-weight:700;color:var(--ink-3);
    font-variant-numeric:tabular-nums}
  .ttp .tm{width:86px;flex:none;font-size:var(--fs-caption1);color:var(--ink-2);
    font-variant-numeric:tabular-nums}
  .ttp .nm{flex:1;min-width:0;font-size:var(--fs-footnote);font-weight:600;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttp .rm{flex:none;font-size:var(--fs-caption1);color:var(--ink-3)}
  .ttp.free{background:transparent}
  .ttp.free .nm{font-weight:500;color:var(--ink-3)}

  /* The one part of the strip this page genuinely cannot draw: which lesson is running
     and how long is left. Its card is held at the height the app's own will be, with a
     single quiet bar where that answer goes. */
  .nolsn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);padding:26px 18px;text-align:center;font-size:var(--fs-subhead);
    font-weight:600;color:var(--ink-2)}
  /* 75px in every state, the same as the app's, so the handover does not jump. It says
     what the app will say before it knows the time — never a time of its own (inv. 31). */
  .ttnow{padding:9px 11px 10px;margin-bottom:12px;min-height:75px;display:flex;
    flex-direction:column;justify-content:center}
  .ttmsg{display:flex;align-items:center;gap:10px;font-size:var(--fs-footnote);line-height:1.5;color:var(--ink-2)}
  .ttmsg .spin{margin:3px}
  /* Ready (W8): App.html's .ttgo and .ttready, kept the same (invariant 35). */
  .ttgo{width:34px;height:34px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;
    background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok)}
  .ttgo svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ttready b{font-size:var(--fs-subhead);font-weight:600;letter-spacing:-.01em;color:var(--ink)}

  /* ---- cached view: mirrors the app's own cards so the swap is invisible ---- */
  .name{margin-left:auto;display:flex;align-items:center;gap:8px}
  .name .nm{font-size:var(--fs-footnote);font-weight:500;color:var(--ink-2)}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--gl-bg);color:var(--ink);
    border:1px solid var(--gl-edge);box-shadow:var(--gl-sm);
    display:grid;place-items:center;font-size:var(--fs-footnote);font-weight:700;flex:none}
  .dhead{text-align:center;margin:2px 0 12px}
  .dhead b{display:block;font-size:var(--fs-callout);font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .dhead span{font-size:var(--fs-footnote);color:var(--ink-2)}
  .note{display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:var(--fs-caption1);color:var(--ink-2);margin:0 auto 12px;padding:5px 12px;width:max-content;
    max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
  .spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-2);
    border-top-color:var(--ink-3);animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  .lessons{display:grid;gap:9px}
  @media(min-width:640px){.lessons{grid-template-columns:1fr 1fr}}
  .lsn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 13px;
    box-shadow:var(--shadow);pointer-events:none;color:var(--ink);font-family:inherit}
  .lsn .per{width:42px;height:42px;flex:none;border-radius:var(--r-sm);background:var(--surface-2);
    border:1px solid var(--line);display:grid;place-content:center;text-align:center}
  .lsn .per b{display:block;font-size:var(--fs-body);font-weight:700;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums}
  .lsn .per span{display:block;font-size:var(--fs-caption2);font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink-3);margin-top:2px}
  .lsn .mid{flex:1;min-width:0}
  .lsn .mid .t{font-weight:600;font-size:var(--fs-subhead);letter-spacing:-.01em}
  .lsn .mid .s{font-size:var(--fs-footnote);color:var(--ink-2);margin-top:1px}
  /* Grid items default to min-width:auto, so a card whose chip will not wrap grows
     past its own track instead of shrinking. Same rule as App.html. */
  .lessons>*{min-width:0}
  .lsn .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;
    min-width:0;max-width:58%}
  .lsn .end .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .lsn .end .n{font-size:var(--fs-caption1);color:var(--ink-3);font-variant-numeric:tabular-nums}
  .lsn.leave{opacity:.7}
  .lsn.leave .per{background:var(--low-soft);border-color:var(--low-line)}

  .chip{font-size:var(--fs-caption1);font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap;
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
  .chip.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
  .chip.todo{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .chip.leave{background:var(--low-soft);border-color:var(--low-line);color:var(--low)}
  .chip.wait{background:var(--surface-2);border-color:var(--line);color:var(--ink-3)}
  .chip.queued{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}


  /* ---- the cached Home, laid out as the app's (Liquid Glass layout in App.html) ----
     Header controls float with no strip; the day is a large title; then now, the day's
     registers as one inset list, and the timetable last. The clock card is not drawn. */
  #instantInner{display:flex;flex-direction:column}
  /* The header as the app draws it (W7, I3): nothing on the left until there is a way back,
     and the account on the right with Live as a dot on the initials — in its "not yet" grey
     until the app takes over and turns it green, so only the dot changes. No name beside the
     avatar, which the app never shows on a phone. The bottom padding puts the title where
     the app's is: its bar is 62px and its page starts 12px under that. */
  #instantInner>.sbar{order:0;padding:0 2px 24px;gap:8px}
  #instantInner>.sbar .slogo{visibility:hidden;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
  .sbar .avatar{position:relative}
  .sbar .avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;box-sizing:border-box;
    border-radius:50%;background:var(--ink-3);border:2.5px solid var(--bg)}
  #instantInner>.dhead,#instantInner>.stuwrap{order:1}
  /* The app's date row is 84px with its day arrows beside it; the still copy has none. */
  #instantInner>.dhead{min-height:84px}
  #instantInner>.ttwhenwrap{display:none}
  #instantInner>.ttnow,#instantInner>.note{order:2}
  #instantInner>.dsum{order:3}
  #instantInner>.lessons,#instantInner>.sblock.hlsn,#instantInner>.nolsn{order:4}
  #instantInner>.tt,#instantInner>.htt{order:5;margin-top:22px}
  .dhead{text-align:left;margin:4px 4px 18px}
  .dhead .eye{display:block;font-style:normal;font-size:var(--fs-footnote);font-weight:600;color:var(--ink-2);margin-bottom:2px}
  .dhead b{font-size:var(--fs-large);line-height:1.2;letter-spacing:.2px;padding-bottom:2px}
  .dhead span{font-size:var(--fs-body)}
  /* A copy of App.html's .daysum (A1): change the two together. */
  .dsum{display:flex;gap:7px;flex-wrap:wrap;align-items:baseline;margin:22px 4px 10px}
  .dsum .lab{font-size:var(--fs-title2);font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-right:auto}
  .dsum .dsfig{font-size:var(--fs-footnote);font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .dsum .dsfig b{font-size:var(--fs-title2);font-weight:700;letter-spacing:-.03em;color:var(--ink);margin-right:1px}
  .dsum .dsbar{flex:1 0 100%;display:flex;gap:3px;height:8px;border-radius:99px;overflow:hidden;margin-top:4px}
  .dsum .dsbar i{display:block;min-width:6px}
  .dsum .taken{background:var(--ring-p)} .dsum .excused{background:var(--ring-l)} .dsum .missing{background:var(--ring-a)} .dsum .dsbar .todo{background:var(--surface-3)}
  .dsum .dskey{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-footnote);color:var(--ink-2);margin-top:2px}
  .dsum .dskey>span{display:inline-flex;align-items:center;gap:5px}
  .dsum .dskey i{width:8px;height:8px;border-radius:99px;flex:none}
  .dsum .dskey .todo{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
  #instantInner .lessons{grid-template-columns:1fr;gap:0;background:var(--surface);border-radius:var(--r-lg);
    overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
  #instantInner .lsn{border:0;border-radius:0;box-shadow:none;background:transparent;min-height:68px;padding:11px 16px}
  #instantInner .lsn:not(:first-child){background:linear-gradient(var(--line),var(--line)) 68px 0/calc(100% - 68px) 1px no-repeat}
  .lsn .per{width:40px;height:40px;border:0;border-radius:12px}
  .lsn .per b{font-size:var(--fs-body)}
  .lsn .per span{display:none}
  .lsn .mid .t{font-size:var(--fs-body);font-weight:500}
  .lsn .mid .s{font-size:var(--fs-subhead)}
  .lsn[data-tone="as1"] .per{background:var(--tt-as1)} .lsn[data-tone="as2"] .per{background:var(--tt-as2)}
  .lsn[data-tone="as3"] .per{background:var(--tt-as3)} .lsn[data-tone="a21"] .per{background:var(--tt-a21)}
  .lsn[data-tone="a22"] .per{background:var(--tt-a22)} .lsn[data-tone="a23"] .per{background:var(--tt-a23)}

  /* ---- taking a register before the app is up ---- */
  .lsn.tap{pointer-events:auto;cursor:pointer;text-align:left;
    transition:border-color .12s ease,background .12s ease,transform .08s ease}
  .lsn.tap:hover{border-color:var(--line-2);background:var(--surface-2)}
  /* Presses as the app's (its "One press, everywhere", invariant 35): a list row takes the
     grey highlight rather than shrinking, a tile or button gives to .97 and a shade darker;
     the press lands at once and the release eases back on the iOS curve. */
  .lsn.tap:active{transform:none;background-color:var(--surface-3)}
  .ph .tab .ic{transition:transform .22s cubic-bezier(.32,.72,0,1)}
  .ph .tab:active .ic{transform:scale(.9);transition-duration:.06s}
  /* The register as the app draws it (W9): back where the app's back is, "Take register"
     over a large title and "P1 · 08:00–08:50 · Thu 22 Oct", the running count as three
     soft tiles, then the tiles — every one an icon and its word, Present included — and
     a floating Save bar. Everyone present is the app's round tick beside the title. Same
     sizes as App.html's register (its .rhead, .rcounts, .tile and .savebar), so a teacher
     is not learning a second register that happens to live in the shell. */
  .qbar{display:flex;align-items:center;padding:0 2px 24px}
  .qback,.qicon{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
    cursor:pointer;color:var(--ink);padding:0;font-family:inherit;
    background:var(--gl-bg);border:1px solid var(--gl-edge);box-shadow:var(--gl-sm);
    -webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur)}
  .qback svg,.qicon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .qhead{display:flex;align-items:flex-start;gap:10px;margin:0 0 12px}
  .qhead .grow{flex:1;min-width:0}
  .qeye{font-size:var(--fs-footnote);font-weight:600;color:var(--ink-2)}
  .qtitle{margin:0;font-size:var(--fs-large);line-height:1.2;font-weight:700;letter-spacing:.2px;color:var(--ink)}
  .qsub{margin:0;font-size:var(--fs-body);color:var(--ink-2)}
  .qcounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
  .qcounts .rc{border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;line-height:1.2}
  .qcounts .rc b{font-size:var(--fs-title2);font-weight:700;font-variant-numeric:tabular-nums}
  .qcounts .rc span{font-size:var(--fs-footnote);font-weight:500}
  .qcounts .p{background:var(--ok-soft);color:var(--ok)}
  .qcounts .l{background:var(--low-soft);color:var(--low)}
  .qcounts .a{background:var(--full-soft);color:var(--full)}
  .qhint{font-size:var(--fs-caption1);color:var(--ink-3);text-align:right;margin:-4px 0 9px}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .qtile{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:68px;
    text-align:left;background:var(--surface);border:1px solid var(--line);
    border-radius:20px;padding:12px 14px;overflow:hidden;box-shadow:var(--shadow);
    cursor:pointer;font-family:inherit;color:var(--ink);
    transition:background .12s ease,border-color .12s ease,transform .08s ease,filter .08s ease}
  .qtile .av{display:none}
  .qtile .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:var(--fs-body);line-height:1.3;font-weight:600;letter-spacing:-.01em}
  .qtile .st{display:flex;align-items:center;gap:4px;min-height:17px;margin-top:1px;
    font-size:var(--fs-footnote);font-weight:600;color:var(--ok)}
  .qtile .st svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .qtile[data-s="L"]{background:var(--low-soft);border-color:var(--low-line)}
  .qtile[data-s="L"] .st{color:var(--low)}
  .qtile[data-s="A"]{background:var(--full-soft);border-color:var(--full-line)}
  .qtile[data-s="A"] .st{color:var(--full)}

  /* ---- a student's cached summary ---- */
  .stot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:18px;text-align:center;margin-bottom:9px;box-shadow:var(--shadow)}
  .stot b{display:block;font-size:var(--fs-large);font-weight:700;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums}
  .stot span{display:block;font-size:var(--fs-footnote);color:var(--ink-2);margin-top:6px}
  .srow{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:8px;box-shadow:var(--shadow)}
  .srow.past{opacity:.55}
  .slab{flex:1;min-width:0;font-size:var(--fs-subhead);font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .sfig{font-size:var(--fs-footnote);color:var(--ink-3);flex:none}
  .spct{font-weight:700;font-size:var(--fs-callout);flex:none;min-width:52px;text-align:right;
    font-variant-numeric:tabular-nums}

  /* The app's floating Save bar. Its second line says the one thing that differs here:
     the register goes once the app has loaded, not this second. */
  .qsavebar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:2;margin:14px 0 0;
    display:flex;align-items:center;gap:12px;padding:7px 7px 7px 20px;border-radius:calc(var(--fs-body) * .6 + 23px);
    background:var(--gl-bar);border:1px solid var(--gl-edge);box-shadow:var(--gl-shadow);
    -webkit-backdrop-filter:var(--gl-bar-blur);backdrop-filter:var(--gl-bar-blur)}
  .qinfo{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .qinfo b{font-size:var(--fs-subhead);font-weight:600}
  .qinfo span{display:flex;align-items:center;gap:5px;font-size:var(--fs-footnote);color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qinfo svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .qbtn{flex:none;padding:13px 22px;border:1px solid var(--gl-p-edge);border-radius:99px;
    background:var(--gl-p);color:var(--gl-p-ink);font-size:var(--fs-body);font-weight:600;cursor:pointer;
    font-family:inherit;box-shadow:var(--gl-p-shadow);
    transition:filter .12s ease,transform .08s ease}
  .qbtn:hover{filter:brightness(1.08)}
  /* (the presses above) */
  .qtile,.qbtn{transition-duration:.22s;transition-timing-function:cubic-bezier(.32,.72,0,1)}
  .qtile:active,.qbtn:active{transform:scale(.97);filter:brightness(.94);transition-duration:.06s}

  /* ---- sign-in (first open, or after Sign out) and the notification gate ----
     One glass card over the six subjects drawn faintly behind it. */
  .ask,.gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;
    overflow-y:auto;background:var(--bg)}
  .ask{z-index:3}
  .gate{z-index:20}
  .gate[hidden]{display:none}
  /* The drawing lives in a <symbol>, and selectors cannot reach into a <use>'s copy of it,
     so its colours are inline var()s, which do inherit through. */
  .art{position:fixed;inset:0;width:100%;height:100%;opacity:var(--art-o);pointer-events:none}
  .box{position:relative;width:100%;max-width:380px;text-align:left;padding:26px 22px 20px;
    border-radius:32px;background:var(--gl-bg);border:1px solid var(--gl-edge);box-shadow:var(--gl-shadow);
    -webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%)}
  .gtile{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;margin-bottom:16px;
    background:var(--surface-3);color:var(--ink);border:1px solid var(--gl-edge);box-shadow:var(--gl-sm)}
  .gtile.warn{background:var(--low-soft);color:var(--low)}
  .gtile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .box .kicker{font-size:var(--fs-footnote);font-weight:600;color:var(--ink-2);margin:0 0 2px}
  .box h1{font-size:var(--fs-title1);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;color:var(--ink)}
  .box p{font-size:var(--fs-subhead);color:var(--ink-2);margin:0 0 16px;line-height:1.45}
  .box label{display:block;font-size:var(--fs-footnote);font-weight:600;margin:0 0 6px;color:var(--ink)}
  .box input{width:100%;-webkit-appearance:none;appearance:none;padding:14px 18px;
    border:1px solid var(--gl-edge);border-radius:99px;font-size:var(--fs-callout);font-family:inherit;
    background:var(--gl-bg);color:var(--ink);box-shadow:var(--gl-sm),inset 0 2px 6px rgba(0,0,0,.06)}
  .box input:focus{outline:2px solid var(--accent);outline-offset:2px}
  .box .go{width:100%;margin-top:12px;padding:15px;border:1px solid var(--gl-p-edge);
    border-radius:99px;background:var(--gl-p);color:var(--gl-p-ink);font-size:var(--fs-callout);
    font-weight:600;cursor:pointer;font-family:inherit;box-shadow:var(--gl-p-shadow)}
  .box .go:hover{filter:brightness(1.08)}
  .box .go[hidden]{display:none}
  .box .foot{font-size:var(--fs-footnote);color:var(--ink-2);text-align:center;margin:14px 0 0}
  .box .err{font-size:var(--fs-footnote);color:var(--full);margin:8px 2px 0}
  .box .err:empty{display:none}
  .okpill{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-size:var(--fs-footnote);font-weight:600;
    white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;color:var(--ink);
    background:var(--gl-bg);border:1px solid var(--gl-edge);box-shadow:var(--gl-sm);
    -webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);z-index:4}
  .okpill[hidden]{display:none}
  .steps{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:8px}
  .steps:empty{display:none}
  .steps li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:22px;font-size:var(--fs-subhead);
    background:var(--gl-bg);border:1px solid var(--gl-edge);box-shadow:var(--gl-sm)}
  .steps li b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    font-size:var(--fs-subhead);background:var(--surface-3);color:var(--ink)}
  .steps .gs{flex:1;min-width:0;line-height:1.35}
  .steps .gs strong{font-weight:700}
  /* The icon to look for on the phone, where the eye ends up after reading the step. */
  .steps .gi{flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--ink-2)}
  .steps .gi svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .steps .gi img{display:block;width:26px;height:26px;border-radius:7px;box-shadow:0 0 0 1px var(--line)}
  /* What notifications are for (W3): two glass tiles side by side, an icon over a word. */
  .gwhy{display:flex;gap:8px;margin:0 0 4px}
  .gwhy:empty{display:none}
  .gw{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 8px 12px;
    border-radius:22px;background:var(--gl-bg);border:1px solid var(--gl-edge);box-shadow:var(--gl-sm);
    font-size:var(--fs-subhead);font-weight:600;color:var(--ink);text-align:center}
  .gw i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
    background:var(--ok-soft);color:var(--ok)}
  .gw:nth-child(2) i{background:var(--accent-soft);color:var(--accent)}
  .gw svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .glink{display:block;width:100%;margin:10px 0 0;padding:12px 16px;border-radius:16px;font-size:var(--fs-subhead);font-weight:500;line-height:1.3;
    font-family:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
    -webkit-user-select:all;user-select:all}
  .glink[hidden]{display:none}
  .gfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;
    font-size:var(--fs-footnote);color:var(--ink-2)}
  /* Sign Out, said the way the app's account menu says it: red words and the same icon,
     no red fill; 44px tall, the smallest a thumb should be asked to hit. */
  .gfoot button{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1px solid var(--gl-edge);
    background:var(--gl-bg);color:var(--full);font:inherit;font-weight:600;border-radius:99px;padding:0 16px 0 13px;
    cursor:pointer;box-shadow:var(--gl-sm)}
  .gfoot button svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---- the loading screen: a sign-in, or any open with nothing cached to paint ----
     Shown in place of the bare skeleton, never over a cached screen (invariant: the
     cached register and a student's cached figures are the fast path, and they stay
     usable). Same layer as the skeleton, below the frame, so the app fades in over it
     exactly as it does over the skeleton, and the stuck bar and the gate land on top. */
  .load{position:fixed;inset:0;z-index:1;display:grid;place-items:center;padding:24px 16px;
    background:var(--bg);transition:opacity .25s ease}
  .load[hidden]{display:none}
  .load.gone{opacity:0;pointer-events:none}
  .load .box{text-align:center;padding:28px 22px 22px}
  .load .gtile{margin:0 auto 14px}
  .load h1{margin:0 0 4px}
  .lstep{font-size:var(--fs-subhead);color:var(--ink);font-weight:600;margin:12px 0 4px;min-height:1.45em}
  .lbar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;
    border:1px solid var(--line);position:relative}
  .lbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
    background:var(--accent);transition:width .45s cubic-bezier(.2,.7,.2,1)}
  .lbar i::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,var(--sheen) 50%,transparent 80%);
    background-size:220% 100%;animation:sh 1.4s linear infinite}
  /* The four stages as icons strung on the bar (W5), in place of "Step 2 of 4" and a
     percentage nobody can act on. The bar runs from the first icon's centre to the last
     and creeps towards the next stage without reaching it; done is a soft green tick, now
     is filled with a slow ring turning round it, still to come is quiet. Every state is
     the same size and the labels never wrap, so nothing moves as it steps on; the words
     that change are in #loadStep, which is what a reader hears. */
  .lsteps{position:relative;margin:16px -6px 0}
  .lsteps .lbar{position:absolute;left:12.5%;right:12.5%;top:15px;height:4px;border:0}
  .lstages{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
  .lstages li{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;
    font-size:var(--fs-caption1);font-weight:600;color:var(--ink-3);white-space:nowrap;transition:color .25s ease}
  .lstages i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:var(--surface-3);color:var(--ink-3);transition:background .25s ease,color .25s ease}
  .lstages svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .lstages .done{color:var(--ink-2)}
  .lstages .done i{background:var(--ok-soft);color:var(--ok)}
  .lstages .on{color:var(--ink)}
  .lstages .on i{position:relative;background:var(--accent);color:var(--accent-ink)}
  .lstages .on i::after{content:"";position:absolute;inset:-5px;border-radius:50%;
    border:2px solid transparent;border-top-color:var(--ink-3);animation:sp 1.2s linear infinite}
  .lstages .on.off i{background:var(--low-soft);color:var(--low)}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
  /* The app's rule (INPUT): a ring is for the keyboard, never left behind by a tap. */
  html[data-input="pointer"] :focus-visible:not(input,textarea,select,[contenteditable]){outline:none}
  /* The wrapper's own overlays come and go as the app's do (owner, 25d: "all the things
     have exit animation"): the bars rise from the bottom and sink back, the gate and the
     signed-out pill fade. Leaving (away()), they take no taps. */
  .notif:not([hidden]){animation:w-in .34s cubic-bezier(.32,.72,0,1) both}
  .gate:not([hidden]),.okpill:not([hidden]){animation:w-fade .25s ease both}
  .notif.leaving{animation:w-out .22s ease-in both;pointer-events:none}
  .gate.leaving,.okpill.leaving{animation:w-unfade .2s ease both;pointer-events:none}
  @keyframes w-in{from{opacity:0;transform:translateY(14px) scale(.98)}}
  @keyframes w-out{to{opacity:0;transform:translateY(14px) scale(.98)}}
  @keyframes w-fade{from{opacity:0}}
  @keyframes w-unfade{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<!--
  SETUP: done — WEBAPP_URL below is this school's live /exec URL, so this file uploads as is.
  If the deployment ever changes, change it here in the repo, never only on Pages.

  Send each teacher:  https://YOURNAME.github.io/attendance/?t=THEIR_TOKEN
  On first open the code is saved on their device and wiped from the address bar, so
  the link stops being visible in history, screenshots or over-the-shoulder glances.
  This file itself contains no teacher codes — it is safe to host publicly.

  After the first successful load the app posts a copy of the day back to this page,
  which stores it per token. Later opens paint those cards immediately, so the teacher
  is looking at their real timetable while Apps Script is still starting up. The
  snapshot holds no student names and no marks — only the lesson grid.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

      <text style="stroke:var(--art-2)" x="150" y="800" font-family="Georgia,'Times New Roman',serif" font-size="76" fill="none">&#8721;</text>

  </symbol>
</svg>
<div class="ask" id="ask" style="display:none">
  <svg class="art" aria-hidden="true" preserveAspectRatio="xMidYMid slice"><use href="#art"/></svg>
  <div class="okpill" id="signedOut" role="status" hidden></div>
  <form class="box" id="askForm" action="#" novalidate>
    <div class="gtile" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2.5v3M16 2.5v3"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg></div>
    <h1>Sign in</h1>
    <p>Paste your KS5 Hub link or code.</p>
    <label for="code">Link or code</label>
    <input id="code" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Link or code">
    <p class="err" id="codeErr" role="alert"></p>
    <button class="go" id="go" type="submit">Continue</button>
    <p class="foot">No link? Ask the office.</p>
  </form>
</div>

<!-- Notifications are required (the school's choice). Until this device can receive them,
     this covers the app and says the one thing that will fix it. Four cases, and none of
     them is a dead end: ask (one tap), an iPhone that must add the app to its Home Screen
     first, a device that said no before (only its settings can undo that), and a browser
     with no push at all — usually a link opened inside another app. Sign out is always
     here, so a shared phone is never stuck on someone else's screen. -->
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle" hidden>
  <svg class="art" aria-hidden="true" preserveAspectRatio="xMidYMid slice"><use href="#art"/></svg>
  <section class="box">
    <div class="gtile" id="gateIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></div>
    <h1 id="gateTitle"></h1>
    <p id="gateBody"></p>
    <div class="gwhy" id="gateWhy"></div>
    <ol class="steps" id="gateSteps"></ol>
    <input class="glink" id="gateLink" type="text" readonly aria-label="Your link" hidden>
    <button class="go" id="gateGo" type="button" hidden></button>
    <div class="gfoot"><span id="gateWho"></span><button type="button" id="gateOut"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>Sign Out</button></div>
  </section>
</div>

<div class="ph" id="shell" aria-hidden="true">
  <div class="inner">
    <div class="sbar"><span class="slogo">KS5 Hub</span><span class="spill"></span><span class="sdot"></span></div>
    <div class="sblock htt"></div>
    <div class="sblock hday" style="width:70%;margin:0 auto 14px"></div>
    <div class="sblock hlsn"></div>
    <div class="sblock hlsn"></div>
    <div class="sblock hlsn"></div>
  </div>
</div>

<!-- The loading screen, for an open with nothing cached to paint (see LOAD below). -->
<div class="load" id="load" hidden>
  <svg class="art" aria-hidden="true" preserveAspectRatio="xMidYMid slice"><use href="#art"/></svg>
  <section class="box" aria-labelledby="loadTitle">

<!-- The opt-in lives out here, not in the app, and neither half could do it alone.

     Apps Script iframe. And Notification.requestPermission() needs transient user
     activation, which does not cross a frame boundary — a button inside the app asking
     the wrapper to prompt would simply be refused on iOS.

     But only the app can talk to the server, over google.script.run, with no CORS in
     the way. So the wrapper gets permission and the subscription; the app registers it.
     It appears when notifications are possible and this person is reachable on no device
     yet. "Not now" holds until the office runs Attendance > Notifications > Ask everyone
     again, which shows it once more; it stops for good once a device says yes. -->
<div class="notif" id="notifBar" hidden>
  <span id="notifText" class="nbell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>Register reminders</span>
  <button type="button" id="notifYes">Turn on</button>
  <button type="button" class="alt" id="notifNo">Not now</button>
</div>

<!-- Shown only when Google served something that is not our app: the frame loaded, but
     the app inside it never said it had painted. Without this a teacher gets Google's own
     error page — in whatever language their account is set to, inside a frame that crops
     it — and no idea that the cause is their own browser. -->
<div class="notif" id="stuckBar" hidden>
  <span id="stuckText"></span>
  <button type="button" id="stuckGo">Try again</button>
  <button type="button" class="alt" id="stuckNo">Close</button>
</div>

<script>
(function () {
  'use strict';

  /* This school's live deployment. Committed, not pasted in at upload time: a placeholder

     deployment, or this URL stops being the live one. */
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxtkE0-FzD5YCp5yweSo4pP2EEtZdVfEl7mW_VTa7hnEkCx41gqpfLj6IonJtCksQHh/exec';

  var SNAP  = 'attendance-snap:';     // one entry per token, so a shared device cannot mix people up
  var QUEUE = 'attendance-queue:';    // registers marked before the app was up
  var STU   = 'attendance-stu:';      // a student's own figures, for their next open
  var TABC  = 'attendance-cache:';    // the other tabs' last answers (plan, gradebook, resources)
  var ADMC  = 'attendance-admin:';    // the admin dashboard's last answer, and the section it was on
  var KEEP_DAYS = 10;

  /* How stale a class list may be and still be typed into. The timetable repeats
     weekly, so last Tuesday's list is almost always this Tuesday's — but a student
     who joined or left three weeks ago should not still be on it. The server has the
     last word regardless: apiSave rebuilds the marks from the current roster. */
  var ROSTER_DAYS = 14;

  function $(id){ return document.getElementById(id); }
  /* Out as it came in (the .leaving rules), then hidden; at once where motion is not

    try { return !!(window.matchMedia && !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&

  }

    setTimeout(function () { if (el.__aw !== tok) return; el.classList.remove('leaving'); el.hidden = true; }, 230);

  function show(el){
    if (!el) return;

  /* ---- the other tabs' copies --------------------------------------------
     Home is painted from the snapshot below. The Weekly Plan, Gradebook and Resources keep
     their last answers here instead: the app posts each one as attendance:cache and gets
     them all back as attendance:cached the moment it is ready, so those tabs draw at once
     and refresh behind. The app's own frame cannot keep them — it is credentialless, and
     its storage goes with the page. Per token, like everything else here, and bounded:
     the oldest answers go first once there are too many or they grow too big. */
  var TABC_MAX = 40, TABC_BYTES = 1500000;
  function readTabCache(token){
    try { var o = JSON.parse(localStorage.getItem(TABC + token) || '{}'); return (o && typeof o === 'object') ? o : {}; }
    catch (e) { return {}; }
  }
  function writeTabCache(token, key, data){
    // A bare name is a key too: Resources keeps its one answer as plain 'res', and a
    // pattern that insisted on a colon turned it away, so that tab never drew from here.
    if (typeof key !== 'string' || key.length > 80 || !/^[a-z]+(?::[\w:|.-]*)?$/i.test(key)) return;
    var all = readTabCache(token);
    if (data === null || data === undefined) delete all[key];
    else all[key] = { data: data, at: Date.now() };
    var keys = Object.keys(all).sort(function (a, b) { return (all[a].at || 0) - (all[b].at || 0); });
    while (keys.length > TABC_MAX) delete all[keys.shift()];
    var text = JSON.stringify(all);
    while (text.length > TABC_BYTES && keys.length > 1) { delete all[keys.shift()]; text = JSON.stringify(all); }
    try { localStorage.setItem(TABC + token, text); }
    catch (e) {

    }
  }

  /* ---- the kept app (invariant 41) ----------------------------------------
     Apps Script takes seconds to serve the app, and until it had, all this page could show
     was a picture of it: the tabs lit up under a finger and did nothing. So this page keeps
     the app itself — the page Apps Script served this person last time, with three slots
     left open (the theme, the timetable's views, the first payload) — and runs it the
     moment it opens, in a sandboxed frame, on last time's payload. Its calls to the server
     go through the bridge, a page with nothing in it but google.script.run, which is up
     long before the whole app would be; until it is, they wait here. The copy is replaced
     whenever the bridge reports a newer build. */
  var SHELLS = 'attendance-shell:', BOOTS = 'attendance-boot:', SHELL_BAD = 'attendance-shell-bad';
  var SLOT_BOOT = '__ATTENDANCE_BOOT__', SLOT_THEME = '__ATTENDANCE_THEME__', SLOT_TT = '__ATTENDANCE_TTPREF__';
  // The Students view's flag, as Code.gs's FLAG_PREF_RE takes it: "days-3-1.5".
  var FLAG_PREF = /^(count|days)-[1-9]\d?-(?:[1-9]\d?(?:\.5)?|0\.5)$/;
  var OFFLINE = 'No connection. Check your signal and try again.';
  function readJSON(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

    var s = readJSON(SHELLS + token);
    return (s && s.v === 1 && typeof s.html === 'string' && typeof s.build === 'string' &&
            (s.mode === 'app' || s.mode === 'student') && s.html.indexOf(SLOT_BOOT) !== -1) ? s : null;
  }
  function writeShell(token, m){
    if (!m || typeof m.html !== 'string' || typeof m.build !== 'string' || !m.build || m.html.length > 2500000 ||
        m.html.indexOf(SLOT_BOOT) === -1 || (m.mode !== 'app' && m.mode !== 'student')) return false;
    // A shared device keeps two people's copies at most, not one for everyone ever signed in.
    try {
      var others = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(SHELLS) === 0 && k !== SHELLS + token) others.push(k);
      }
      others.sort(function (a, b) { return ((readJSON(a) || {}).at || 0) - ((readJSON(b) || {}).at || 0); });

    } catch (e) {}
    try {
      localStorage.setItem(SHELLS + token, JSON.stringify({ v: 1, build: m.build, mode: m.mode, html: m.html, at: Date.now() }));
      return true;

    var b = readJSON(BOOTS + token);

  }
  function writeBoot(token, boot){

  function shellBad(build){ try { return localStorage.getItem(SHELL_BAD) === build; } catch (e) { return false; } }

    try {

  }
  /* google.script.run, for the kept copy: every call is posted up here, and its answer
     posted back down, to the same success or failure handler the page gave it. */

    'function send(fn,args,ok,fail,uo){var id="r"+(++n)+"."+Date.now().toString(36);wait[id]={ok:ok,fail:fail,uo:uo};' +

      'if(k==="withSuccessHandler")return function(f){return runner(f,fail,uo);};' +

    '})();<\/script>';
  /* The kept page with its slots filled: last time's payload, marked cached and with no

  function keptDoc(sh, boot){
    var b = JSON.parse(JSON.stringify(boot));
    b.cached = true;

    var json = JSON.stringify(b).replace(/</g, '\\u003c')
      .replace(new RegExp(String.fromCharCode(0x2028), 'g'), '\\u2028')
      .replace(new RegExp(String.fromCharCode(0x2029), 'g'), '\\u2029');   // line breaks JSON allows and a script does not
    var theme = '', tv = '', to = '', pv = '', fl = '';
    try {
      theme = localStorage.getItem('attendance-theme') || '';
      tv = localStorage.getItem('attendance-tt-view') || '';
      to = localStorage.getItem('attendance-tt-open') || '';
      pv = localStorage.getItem('attendance-plan-view') || '';
      fl = localStorage.getItem('attendance-flag') || '';

    html = fill(html, SLOT_THEME, (theme === 'dark' || theme === 'light') ? theme : '');
    html = fill(html, SLOT_TT, ((tv === 'day' || tv === 'week') ? tv : '') + ',' +
      ((to === '0' || to === '1') ? to : '') + ',' + ((pv === 'day' || pv === 'week') ? pv : '') + ',' +

  /* ---- files out (invariant 42) --------------------------------------------
     The app hands its spreadsheets and printouts up here: this is the top of the page,
     where no sandbox stands between it and a download or a print dialog. Only ever a CSV,
     whatever name it asks for, and a printout is shown in a frame that runs no script. */
  function saveFile(name, text){
    var base = String(name || 'Export').replace(/\.[A-Za-z0-9]{1,5}$/, '').replace(/[\\\/:*?"<>|]+/g, ' ').trim().slice(0, 90) || 'Export';

  }

     time. A missing or silly number falls back to the stylesheet rather than writing
     an inline height nobody can override. */
  function stripGap(px){
    var n = Number(px);
    return '<div class="sblock htt"' +
      (isFinite(n) && n > 0 && n < 600 ? ' style="height:' + Math.round(n) + 'px"' : '') +
      '></div>';
  }

  /* ---- the timetable card, drawn from the app's own copy of the week ----

     The gap above is the fallback, and it used to be all there was: a shimmering
     slab the height of a teacher's timetable, filling the first screen with nothing.
     The app now leaves the shape of the week behind (TIMETABLE.cache), which is
     enough to draw the card for real — the same markup its own module emits, so what
     is on screen at 200ms and what arrives at 4s are the same picture.

     What is NOT drawn: the countdown, the ring around the lesson running now, and the
     time of day. All three need the school's clock, which lives on the server; the
     device's own clock is not a substitute (invariant 31). Nothing here is tappable
     either — the week is a picture until the app is ready to act on a tap. */
  var TT_CAL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/>' +
    '<path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  var TT_CHEV = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  var TT_TONES = { as1:1, as2:1, as3:1, a21:1, a22:1, a23:1 };

  function ttTone(l){ return (l && TT_TONES[l.tone]) ? ' data-tone="' + l.tone + '"' : ''; }
  function ttAt(day){
    var m = {};

    return m;
  }
  function ttSpan(l){ return l && l.start ? l.start + (l.end ? '\u2013' + l.end : '') : ''; }

  function ttDayOf(tt, iso){

    return chips + '<div class="ttlist">' + rs.map(function (r) {
      var l = have[r.p];
      return '<div class="ttp' + (l ? '' : ' free') + '"' + (l ? ttTone(l) : '') + '>' +
        '<span class="pn">' + esc(r.p) + '</span>' +
        '<span class="tm">' + esc(ttSpan(l || r)) + '</span>' +
        '<span class="nm">' + (l ? esc(l.label) : 'Free') + '</span>' +

  /* The clock card, the timetable, and a held-open card for the countdown — the same
     three the app paints, in the same order. Falls back to the plain reserved gap for

  /* away: the week has a Timetable tab of its own in the app (invariant 46), so Home holds
     only the card for what is on now — drawn here, held open, as the app will. */
  /* What the card says. Ready is the app's own ready card (W8): there is nothing to wait
     for, so no spinner; the other two are still checking, and say so with one. */
  var READY = 'Tap a lesson to take the register';
  var TAP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10.5a1.5 1.5 0 0 1 3 0V12"/><path d="M15 11.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.5 15a1.6 1.6 0 0 1 2.6-1.8L9 16"/></svg>';
